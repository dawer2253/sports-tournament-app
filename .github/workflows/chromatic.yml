name: Chromatic

# Regresja wizualna Storybooka. Zależności instalujemy w rootcie (npm workspaces,
# jeden package-lock.json), a sam build Storybooka leci w packages/ui.
#
# Tymczasowo tylko ręcznie (Actions → Chromatic → Run workflow): skończył się limit
# snapshotów w planie Chromatica, a status „UI Tests” wisiał na PR-ach jako
# pending. Żeby wrócić do pracy na każdym PR-ze i po merge'u do main, przywróć:
#   push:
#     branches: [main]
#   pull_request:
on:
  workflow_dispatch:

# Nowszy push na ten sam branch anuluje poprzedni build (oszczędza minuty i snapshoty).
concurrency:
  group: chromatic-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  chromatic:
    name: Regresja wizualna (Chromatic)
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 — Chromatic potrzebuje pełnej historii git do wyliczenia baseline.
      - name: Checkout (pełna historia)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node + cache npm
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalacja zależności
        run: npm ci

      # Akcja sama odpali `npm run build-storybook` w workingDir, zbuduje i wyśle snapshoty.
      - name: Publikacja do Chromatic
        uses: chromaui/action@latest # opcjonalnie przypnij do konkretnego SHA
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          workingDir: packages/ui
          buildScriptName: build-storybook
          # Zmiany wizualne nie wywalają joba — akceptujesz je w UI Chromatic (lub przez GitHub App).
          exitZeroOnChanges: true
          # Zmiany oglądamy i akceptujemy na PR-ze. Po merge'u build na main sam staje się
          # nowym baseline'em — bez tego baseline nie przesuwa się do czasu ręcznej akceptacji
          # i ta sama zmiana wraca do zaakceptowania przy każdym kolejnym buildzie.
          autoAcceptChanges: main
          # TurboSnap — snapshotuje tylko stories dotknięte zmianą (mocno oszczędza limit).
          # Wymaga fetch-depth: 0 powyżej. Przy niepewności (zmiana w configu, lockfile,
          # brak danych o poprzednim buildzie) sam robi pełny build, więc nie gubi regresji.
          onlyChanged: true

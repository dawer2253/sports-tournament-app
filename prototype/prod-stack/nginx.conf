# PROTOTYP (#277). Jeden origin, trzy role:
#   /            → zbudowana strona publiczna (SPA, fallback na index.html)
#   /admin/      → zbudowany panel (SPA, fallback na index.html)
#   /api/, /up   → Laravel przez php-fpm
#   /storage/    → uploady z dysku `public` (symlink public/storage)
#
# Panel wymaga `base=/admin/` w Vite i `basename` w routerze — patrz README.

server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php;
    client_max_body_size 10m;

    # `return 301 /admin/` nginx robi absolutnym i gubi port z Host (localhost
    # zamiast localhost:8080), więc Location leci względny.
    absolute_redirect off;

    # Health check Laravela (bootstrap/app.php: health: '/up').
    location = /up {
        try_files $uri /index.php?$query_string;
    }

    # API pod jednym origin — bez CORS.
    location /api/ {
        try_files $uri /index.php?$query_string;
    }

    # Uploady: public/storage → storage/app/public (artisan storage:link).
    location /storage/ {
        try_files $uri =404;
    }

    # Panel pod prefiksem. Bez `alias` — katalog leży w public/admin, więc
    # `try_files` działa na zwykłym rootcie. Fallback tylko na plik (bez `$uri/`),
    # bo `$uri/` trafia w katalog i `index` szuka tam index.php → 403.
    location /admin/ {
        try_files $uri /admin/index.html;
    }

    location = /admin {
        return 301 /admin/;
    }

    # Strona publiczna: wszystko pozostałe, także /t/{slug} i /t/{slug}/mecz/{id}.
    location / {
        root /var/www/frontend/public;
        try_files $uri /index.html;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}

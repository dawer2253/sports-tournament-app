services:
    laravel.test:
        build:
            context: './vendor/laravel/sail/runtimes/8.5'
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP:-1000}'
        image: 'sail-8.5/app'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        # Szkielet wystawiał tu też ${VITE_PORT:-5173} pod dev server Vite.
        # Backend nie ma frontu, a 5173 zajmuje apps/admin na hoście — mapowanie
        # wypadło, żeby `make up` nie kolidowało z `npm run dev:admin`.
        ports:
            - '${APP_PORT:-80}:80'
        environment:
            WWWUSER: '${WWWUSER:-1000}'
            LARAVEL_SAIL: 1
            SUPERVISOR_PHP_USER: '${SUPERVISOR_PHP_USER:-sail}'
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        # Krótka forma (`- mysql`) pilnuje tylko kolejności startu, nie gotowości
        # bazy — aplikacja wstawała, gdy MySQL jeszcze nie przyjmował połączeń,
        # więc migracje zaraz po `up` wywalały się na SQLSTATE.
        depends_on:
            mysql:
                condition: service_healthy
    mysql:
        image: 'mysql:8.4'
        ports:
            - '${FORWARD_DB_PORT:-3306}:3306'
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ROOT_HOST: '%'
            MYSQL_DATABASE: '${DB_DATABASE}'
            MYSQL_USER: '${DB_USERNAME}'
            MYSQL_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ALLOW_EMPTY_PASSWORD: 1
            MYSQL_EXTRA_OPTIONS: '${MYSQL_EXTRA_OPTIONS:-}'
        volumes:
            - 'sail-mysql:/var/lib/mysql'
            - './vendor/laravel/sail/database/mysql/create-testing-database.sh:/docker-entrypoint-initdb.d/10-create-testing-database.sh'
        networks:
            - sail
        # Domyślne 3 próby bez `start_period` odmierzają się od sekundy zero, a
        # pierwszy start MySQL-a to inicjalizacja katalogu danych — kontener
        # bywał uznany za niezdrowy, zanim w ogóle wstał. start_period nie liczy
        # nieudanych prób, więc dopiero z nim `condition: service_healthy` ma sens.
        healthcheck:
            test:
                - CMD
                - mysqladmin
                - ping
                - '-p${DB_PASSWORD}'
            interval: 5s
            timeout: 5s
            retries: 10
            start_period: 60s
networks:
    sail:
        driver: bridge
volumes:
    sail-mysql:
        driver: local

      - name: stageId
        in: query
        required: true
        description: |
          Wymagane, bo to ono trzyma odpowiedź w rozmiarze, który wolno oddać
          bez stronicowania. Faza nienależąca do turnieju daje puste `data`,
          nie `404`: `404` jest tu odpowiedzią o turnieju.

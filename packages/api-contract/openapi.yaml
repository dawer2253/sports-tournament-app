        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /tournaments/{tournament}/stages:
    parameters:
      - { $ref: '#/components/parameters/TournamentId' }
    get:
      tags: [Tournaments]
      summary: Fazy turnieju
      description: |
        Turniej ma zawsze co najmniej jedną fazę, także gdy jest zwykłą ligą.
        Endpointy zapisu dla faz wchodzą w v0.2 razem z silnikiem rozgrywek.

        Fazy idą po `order` rosnąco. Drugi klucz nie jest potrzebny, bo `order`
        jest unikalny w obrębie turnieju.
      responses:
        '200':
          description: Fazy wraz z grupami
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Stage' }
              example:
                data:
                  - id: 1
                    type: league
                    name: Faza zasadnicza
                    order: 1
                    groups: []
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /stages/{stage}/schedule:
    parameters:
      - { $ref: '#/components/parameters/StageId' }
    post:
      tags: [Schedule]
      summary: Wygeneruj terminarz fazy
      description: |
        Układa fazę `league` w kolejki „każdy z każdym” według tablic Bergera
        i zastępuje cały dotychczasowy terminarz fazy, także terminy i obiekty
        poprawione ręcznie. Wszystko dzieje się w jednej transakcji.

        - Grają wszystkie drużyny turnieju. Ich kolejność na wejściu jest
          losowana przy każdym wywołaniu, więc kolejne generowanie daje inne
          pary w kolejkach.
        - `meetings: 2` dokłada rewanż jako czyste lustro: kolejka
          `n − 1 + t` (`n` przy nieparzystej liczbie drużyn) to kolejka `t`
          z odwróconym gospodarzem.
        - Przy nieparzystej liczbie drużyn jedna drużyna pauzuje w każdej
          kolejce. Pauza nie tworzy meczu.
        - Kolejki nazywają się „Kolejka 1”, „Kolejka 2”… z numeracją ciągłą
          przez obie rundy. Mecze są `scheduled`, bez `kickoffAt` i bez
          obiektu.

        Status turnieju nie ma znaczenia. Odmowy to `422`: pod `stage`, gdy
        faza nie jest `league` albo ma mecz `live` lub `finished`, i pod
        `teams`, gdy turniej ma mniej niż dwie drużyny. Faza `knockout` dostaje
        osobny komunikat, który odsyła do `POST /stages/{stage}/bracket`. Mecze
        dociąga się potem przez `GET /tournaments/{tournament}/matches?stageId=`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [meetings]
              properties:
                meetings:
                  type: integer
                  enum: [1, 2]
                  description: |
                    Ile razy w fazie spotyka się każda para: `1` to jedna
                    runda, `2` to mecz i rewanż. Bez wartości domyślnej.
            example:
              meetings: 2
      responses:
        '201':
          description: Terminarz wygenerowany
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [roundsCount, matchesCount]
                    properties:
                      roundsCount: { type: integer, minimum: 1 }
                      matchesCount: { type: integer, minimum: 1 }
              example:
                data: { roundsCount: 38, matchesCount: 380 }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: Fazy nie da się wygenerować albo ciało jest niepoprawne
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }
              examples:
                zaMaloDruzyn:
                  summary: Mniej niż dwie drużyny
                  value:
                    message: Liga potrzebuje co najmniej dwóch drużyn.
                    errors:
                      teams: [Liga potrzebuje co najmniej dwóch drużyn.]
                rozegraneMecze:
                  summary: Faza ma mecz trwający albo zakończony
                  value:
                    message: Faza ma rozegrane mecze, więc nie można wygenerować terminarza ponownie.
                    errors:
                      stage: [Faza ma rozegrane mecze, więc nie można wygenerować terminarza ponownie.]
                fazaNieLigowa:
                  summary: Faza inna niż `league`
                  value:
                    message: Generowanie terminarza działa na razie tylko dla fazy ligowej.
                    errors:
                      stage: [Generowanie terminarza działa na razie tylko dla fazy ligowej.]
                fazaPucharowa:
                  summary: Faza `knockout` — tę układa drabinka
                  value:
                    message: Faza pucharowa nie ma terminarza „każdy z każdym”. Wygeneruj dla niej drabinkę.
                    errors:
                      stage: [Faza pucharowa nie ma terminarza „każdy z każdym”. Wygeneruj dla niej drabinkę.]

  /stages/{stage}/schedule/dates:
    parameters:
      - { $ref: '#/components/parameters/StageId' }
    post:
      tags: [Schedule]
      summary: Rozłóż daty i obiekty terminarza
      description: |
        Nadaje terminy i obiekty meczom fazy, która ma już terminarz
        (`POST /stages/{stage}/schedule`) albo drabinkę
        (`POST /stages/{stage}/bracket`). To osobny krok po wygenerowaniu par,
        więc przestawienie dat nie losuje ich od nowa. Faza może trwale zostać
        bez dat, a pojedynczy mecz bez terminu i obiektu („termin do
        ustalenia”).

        „Kolejka” znaczy niżej kolejkę lub rundę: kolejkę ligi albo rundę
        drabinki, bo w API to jeden byt (`Round`).

        - `mode: interval` — liga sezonowa: kolejka `k` (licząc od pierwszej
          rozkładanej) zaczyna się `startAt + (k − 1) × intervalDays` dni,
          licząc w `timeZone`. Dzięki temu ta sama godzina zegarowa obowiązuje
          także przez zmianę czasu.
        - `mode: continuous` — turniej jedno-, dwudniowy: mecz za meczem,
          kolejka `k + 1` zaczyna się w pierwszym slocie po ostatnim meczu
          kolejki `k`, nigdy wcześniej.
        - Mecz `j` w kolejce (licząc od zera) dostaje obiekt
          `venueIds[j mod V]` i godzinę startu kolejki plus
          `⌊j / V⌋ × matchDuration`. Bez obiektów cała kolejka gra o jednej
          godzinie i bez obiektu. Mecze kolejki idą po `matchNumber`, z jednym
          wyjątkiem: w rundzie z meczem o 3. miejsce (oba jego wejścia to
          `loserToMatchId`) ten mecz idzie przed finałem, więc dostaje termin
          przed nim.
        - `dayEndTime` (tylko `continuous`): slot, który **kończyłby się** po tej
          godzinie, przechodzi na następny dzień kalendarzowy o godzinie
          `startAt`. Kolejka może przez to rozciągnąć się na dwa dni. Wyjątkiem
          jest slot dłuższy niż okno dnia (od `startAt` do `dayEndTime`): taki
          slot zostaje, bo nie da się go zmieścić nigdzie.
        - `fromRound` — `order` kolejki, od której rozkład idzie od nowa
          (domyślnie od pierwszej). Zastępuje osobną operację „przesuń kolejkę”.
        - Rusza wyłącznie mecze `scheduled` w kolejkach od `fromRound`
          i nadpisuje ręczne korekty. Mecze `live` i `finished` oraz kolejki
          przed `fromRound` zachowują termin i obiekt.

        Rozkład wolno powtarzać zawsze. Status turnieju nie gra roli. Odmowa to
        `422` pod `stage`, gdy faza nie ma jeszcze terminarza. Odpowiedź niesie
        liczbę meczów, które dostały termin, i liczbę meczów fazy, które po
        rozkładzie mają kolizję.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode, startAt, timeZone]
              properties:
                mode:
                  type: string
                  enum: [interval, continuous]
                startAt:
                  type: string
                  format: date-time
                  description: |
                    Początek pierwszej rozkładanej kolejki. **Wymagany offset**
                    (np. `+02:00` albo `Z`): data bez offsetu daje `422`, bo nie
                    wiadomo, który moment organizer miał na myśli (ADR-0008).
                    Backend przelicza wartość na UTC i przyjmuje ten sam moment,
                    więc `2026-09-06T10:00:00+02:00` to `08:00:00+00:00`.
                timeZone:
                  type: string
                  description: |
                    Strefa IANA (np. `Europe/Warsaw`), w której liczona jest
                    arytmetyka „+7 dni o tej samej godzinie” i „następny dzień
                    o godzinie startu”. Panel bierze ją z przeglądarki.
                intervalDays:
                  type: [integer, 'null']
                  minimum: 1
                  description: |
                    Odstęp między kolejkami w dniach. Wymagane przy
                    `mode: interval`; przy `mode: continuous` musi być nieobecne.
                dayEndTime:
                  type: [string, 'null']
                  pattern: '^([01]\d|2[0-3]):[0-5]\d$'
                  description: |
                    Najpóźniejsza godzina dnia (w `timeZone`, `HH:MM`), o której
                    mecz może się skończyć. Dozwolone tylko przy
                    `mode: continuous`.
                venueIds:
                  type: array
                  maxItems: 20
                  uniqueItems: true
                  description: |
                    Obiekty turnieju, na które rozkładane są sloty, w kolejności
                    użycia. Bez powtórzeń. Obiekt innego turnieju albo usunięty
                    daje `422`. Brak pola albo pusta lista znaczy „bez obiektów”:
                    wtedy cała kolejka gra o jednej godzinie i bez obiektu.
                  items: { type: integer, format: int64 }
                fromRound:
                  type: [integer, 'null']
                  minimum: 1
                  description: |
                    `order` kolejki, od której rozkład idzie od nowa. Bez pola
                    rozkład obejmuje wszystkie kolejki.
            example:
              mode: interval
              startAt: '2026-09-06T10:00:00+02:00'
              timeZone: Europe/Warsaw
              intervalDays: 7
              dayEndTime: null
              venueIds: [1, 2]
              fromRound: null
      responses:
        '200':
          description: Daty rozłożone
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [matchesCount, collisionsCount]
                    properties:
                      matchesCount:
                        type: integer
                        minimum: 0
                        description: |
                          Ile meczów `scheduled` dostało termin i obiekt. Bez
                          wybranych obiektów mecz dostaje sam termin, a obiekt
                          zostaje pusty.
                      collisionsCount:
                        type: integer
                        minimum: 0
                        description: |
                          Ile meczów fazy po rozkładzie ma kolizję, licząc także
                          kolizje z meczami innych faz tego samego turnieju.
              example:
                data: { matchesCount: 190, collisionsCount: 2 }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: Faza nie ma terminarza albo ciało jest niepoprawne
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }
              examples:
                bezTerminarza:
                  summary: Faza nie ma jeszcze terminarza
                  value:
                    message: Faza nie ma jeszcze terminarza, więc nie ma czego rozkładać.
                    errors:
                      stage: [Faza nie ma jeszcze terminarza, więc nie ma czego rozkładać.]

  /stages/{stage}/bracket:
    parameters:
      - { $ref: '#/components/parameters/StageId' }
    post:
      tags: [Schedule]
      summary: Wygeneruj drabinkę fazy pucharowej
      description: |
        Układa fazę `knockout` w drabinkę single elimination i zastępuje całą
        dotychczasową drabinkę fazy, także terminy i obiekty poprawione ręcznie.
        Wszystko dzieje się w jednej transakcji.

        - `teamIds` to wszystkie drużyny turnieju, każda dokładnie raz,
          w kolejności rozstawienia: pierwsza jest najwyżej rozstawiona.
          Losowanie to wymieszanie tej listy po stronie klienta. Kolejność
          nie jest przechowywana, zostaje po niej tylko kształt drabinki.
        - Rozmiar drabinki to najbliższa potęga dwójki ≥ liczby drużyn.
          Seed trafia na pozycję według standardowej reguły (1–16, 8–9, 4–13…),
          więc seedy 1…2^k nie spotkają się, zanim zostanie 2^k drużyn.
        - Wolne losy (2^k − n) dostają najwyżej rozstawieni. Wolny los nie
          tworzy meczu: drużyna stoi od razu w meczu drugiej rundy.
        - `matchNumber` to pozycja w pełnej drabince, więc w pierwszej rundzie
          ma dziury w miejscach wolnych losów. Mecz o nieparzystym numerze
          zasila gospodarza meczu następnego (ADR 0004).
        - Rundy nazywają się według rozmiaru: „1/64 finału” … „1/8 finału”,
          „Ćwierćfinał”, „Półfinał”, „Finał”.
        - `thirdPlaceMatch: true` dokłada mecz o 3. miejsce w rundzie finału
          (`matchNumber: 2`), do którego półfinały prowadzą `loserToMatchId`.
        - Mecze są `scheduled`, bez `kickoffAt` i bez obiektu. Daty rozkłada
          `POST /stages/{stage}/schedule/dates`.

        Status turnieju nie ma znaczenia. Odmowy to `422`: pod `stage`, gdy
        faza nie jest `knockout` albo ma mecz `live` lub `finished`; pod
        `teams`, gdy turniej ma mniej niż dwie drużyny; pod `teamIds`, gdy
        lista nie jest dokładnie zbiorem drużyn turnieju; pod
        `thirdPlaceMatch`, gdy mecz o 3. miejsce zamówiono przy mniej niż
        czterech drużynach. Odmowa niczego nie zmienia. Mecze dociąga się potem
        przez `GET /tournaments/{tournament}/matches?stageId=`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [teamIds, thirdPlaceMatch]
              properties:
                teamIds:
                  type: array
                  minItems: 2
                  uniqueItems: true
                  items: { type: integer, format: int64 }
                  description: Drużyny turnieju w kolejności rozstawienia, od najwyżej rozstawionej.
                thirdPlaceMatch:
                  type: boolean
                  description: Czy dołożyć mecz o 3. miejsce. Bez wartości domyślnej.
            example:
              teamIds: [12, 7, 3, 9, 15, 4]
              thirdPlaceMatch: true
      responses:
        '201':
          description: Drabinka wygenerowana
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [roundsCount, matchesCount]
                    properties:
                      roundsCount: { type: integer, minimum: 1 }
                      matchesCount: { type: integer, minimum: 1 }
              example:
                data: { roundsCount: 3, matchesCount: 6 }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: Fazy nie da się wygenerować albo ciało jest niepoprawne
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }
              examples:
                nieTaFaza:
                  summary: Faza inna niż `knockout`
                  value:
                    message: Drabinkę generuje się tylko w fazie pucharowej.
                    errors:
                      stage: [Drabinkę generuje się tylko w fazie pucharowej.]
                rozegraneMecze:
                  summary: Faza ma mecz trwający albo zakończony
                  value:
                    message: Faza ma rozegrane mecze, więc nie można wygenerować drabinki ponownie.
                    errors:
                      stage: [Faza ma rozegrane mecze, więc nie można wygenerować drabinki ponownie.]
                zaMaloDruzyn:
                  summary: Mniej niż dwie drużyny
                  value:
                    message: Puchar potrzebuje co najmniej dwóch drużyn.
                    errors:
                      teams: [Puchar potrzebuje co najmniej dwóch drużyn.]
                niepelnaLista:
                  summary: Lista z brakującą, obcą albo powtórzoną drużyną
                  value:
                    message: Lista musi zawierać każdą drużynę turnieju dokładnie raz.
                    errors:
                      teamIds: [Lista musi zawierać każdą drużynę turnieju dokładnie raz.]
                meczO3Miejsce:
                  summary: Mecz o 3. miejsce przy mniej niż czterech drużynach
                  value:
                    message: Mecz o 3. miejsce wymaga co najmniej czterech drużyn.
                    errors:
                      thirdPlaceMatch: [Mecz o 3. miejsce wymaga co najmniej czterech drużyn.]

  /tournaments/{tournament}/teams:
    parameters:
      - { $ref: '#/components/parameters/TournamentId' }
    get:
      tags: [Teams]
      summary: Drużyny w turnieju
      description: |
        Po `name` rosnąco, a drużyny o tej samej nazwie rozstrzyga `id`, też rosnąco.
      responses:
        '200':
          description: Pełna lista drużyn, bez stronicowania
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Team' }
              example:
                data:
                  - { id: 3, tournamentId: 1, name: Orły Bielany, logoUrl: null, groupId: null, playersCount: 3, scheduledMatchesCount: 2 }
                  - { id: 2, tournamentId: 1, name: Sokoły Ursus, logoUrl: null, groupId: null, playersCount: 3, scheduledMatchesCount: 2 }
                  - { id: 1, tournamentId: 1, name: Wilki Bemowo, logoUrl: null, groupId: null, playersCount: 3, scheduledMatchesCount: 2 }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Teams]
      summary: Dodaj drużynę
      description: |
        Nazwa jest unikalna wśród drużyn turnieju, bez względu na wielkość
        liter. Spacje na brzegach nazwy są obcinane, a drużyna usunięta nie
        blokuje nazwy. Konflikt nazw daje `422` z błędem pod `name`.

        Turniej mieści najwyżej 128 drużyn. Próba dodania kolejnej daje `422`
        z błędem pod `teams`.

        Turniej z meczem rozegranym albo trwającym (`finished` albo `live`)
        nie przyjmuje nowych drużyn: próba daje `422` z błędem pod `teams`.
        Wcześniej dodawanie jest dozwolone, ale istniejący terminarz nowej
        drużyny nie obejmuje — obejmie ją dopiero ponowne wygenerowanie.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 120 }
            example:
              name: Wilki Bemowo
      responses:
        '201':
          description: Drużyna dodana
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Team' }
              example:
                data: { id: 1, tournamentId: 1, name: Wilki Bemowo, logoUrl: null, groupId: null, playersCount: 0, scheduledMatchesCount: 0 }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /teams/{team}:
    parameters:
      - { $ref: '#/components/parameters/TeamId' }
    get:
      tags: [Teams]
      summary: Szczegóły drużyny
      responses:
        '200':
          description: Drużyna
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Team' }
              example:
                data: { id: 1, tournamentId: 1, name: Wilki Bemowo, logoUrl: null, groupId: null, playersCount: 3, scheduledMatchesCount: 2 }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Teams]
      summary: Zmień drużynę
      description: |
        Nazwa podlega tym samym zasadom co przy `POST
        /tournaments/{tournament}/teams`, a konflikt nazw daje `422` z błędem
        pod `name`.

        Przypisania do grupy nie da się w v0.1 zmienić: grupy są poza zakresem
        tej wersji, więc `Team.groupId` jest wyłącznie do odczytu i zawsze `null`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 1, maxLength: 120 }
      responses:
        '200':
          description: Drużyna po zmianie
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Team' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Teams]
      summary: Usuń drużynę
      description: |
        Usuwa także zawodników drużyny i wszystkie jej mecze `scheduled`
        (`Team.scheduledMatchesCount`). Reszta terminarza się nie zmienia:
        kolejki zostają, także te, które opustoszały, a pozostałe mecze
        zachowują termin, obiekt, kolejkę i `matchNumber`. Numery meczów nie
        są przenumerowywane, więc w kolejce mogą powstać dziury.

        Daje `422` z błędem pod `id`, jeżeli drużyna ma mecz rozegrany albo
        trwający (`finished` albo `live`): usunięcie zmieniłoby tabelę wstecz.
        Odmowa niczego nie zmienia — drużyna, jej zawodnicy i mecze zostają.

        Drużyna w drabince (faza `knockout`, w której drużyna stoi w którymś
        meczu) idzie inaczej, bo drabinki nie da się załatać jak kolejki:

        - dopóki żaden mecz fazy nie jest rozpoczęty, usunięcie kasuje całą
          drabinkę fazy, czyli jej rundy i mecze, a nie same mecze drużyny.
          Drabinkę generuje się potem od nowa (`POST /stages/{stage}/bracket`);
        - po pierwszym meczu rozpoczętym fazy daje `422` pod `id`
          (`DeleteBlocked`), także dla drużyny, która jeszcze nie grała.
          Wycofanie drużyny wpisuje się wtedy jako walkower.

        Drużyna dodana po wygenerowaniu drabinki w niej nie stoi, więc usuwa
        się jak w lidze.
      responses:
        '204': { description: Usunięto }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/DeleteBlocked' }

  /teams/{team}/logo:
    parameters:
      - { $ref: '#/components/parameters/TeamId' }
    post:
      tags: [Teams]
      summary: Wgraj herb drużyny
      description: |
        Przyjmuje PNG, JPG albo WebP o rozmiarze do 2 MB i wymiarach od 64×64
        do 4096×4096 pikseli, bez wymogu proporcji. O formacie decyduje treść
        pliku, nie nazwa ani rozszerzenie. Obraz jest zapisywany bez
        przetwarzania.

        Nowy plik zastępuje poprzedni, a poprzedni jest kasowany. Każdy upload
        daje nowy `logoUrl`, więc dotychczasowy adres przestaje działać.
        Naruszenie daje `422` pod `logo`.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [logo]
              properties:
                logo: { type: string, format: binary }
      responses:
        '200':
          description: Drużyna z nowym herbem
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Team' }
              example:
                data: { id: 1, tournamentId: 1, name: Wilki Bemowo, logoUrl: http://localhost:8000/storage/tournaments/1/teams/1/GmvZcUftUF1rp7d6ntSTGxnDGWHVCmrmYYNbs9IG.png, groupId: null, playersCount: 3, scheduledMatchesCount: 2 }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Teams]
      summary: Usuń herb drużyny
      description: |
        Kasuje plik i ustawia `logoUrl` na `null`. Operacja jest idempotentna:
        bez wgranego logo też daje `200`.
      responses:
        '200':
          description: Drużyna bez herbu
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Team' }
              example:
                data: { id: 1, tournamentId: 1, name: Wilki Bemowo, logoUrl: null, groupId: null, playersCount: 3, scheduledMatchesCount: 2 }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /teams/{team}/players:
    parameters:
      - { $ref: '#/components/parameters/TeamId' }
    get:
      tags: [Players]
      summary: Zawodnicy drużyny
      description: |
        Po `number` rosnąco, a zawodnicy bez numeru na końcu. Przy tym samym
        numerze (albo jego braku) decyduje `name`, a potem `id`, oba rosnąco.
      responses:
        '200':
          description: Pełna lista zawodników, bez stronicowania
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Player' }
              example:
                data:
                  - { id: 2, teamId: 1, name: Piotr Kowal, number: 1, position: bramkarz }
                  - { id: 3, teamId: 1, name: Jakub Wrona, number: 7, position: pomocnik }
                  - { id: 1, teamId: 1, name: Marek Nowak, number: 9, position: napastnik }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Players]
      summary: Dodaj zawodnika
      description: |
        `number` jest unikalny wśród tych zawodników drużyny, którzy mają
        numer; `null` z niczym nie koliduje, a zawodnik usunięty nie blokuje
        numeru. Konflikt numerów daje `422` z błędem pod `number`. Imię
        i nazwisko mogą się w drużynie powtarzać. `position` to wolny tekst.

        Drużyna mieści najwyżej 50 zawodników. Próba dodania kolejnego daje
        `422` z błędem pod `players`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 120 }
                number: { type: [integer, 'null'], minimum: 0, maximum: 999 }
                position: { type: [string, 'null'], maxLength: 60 }
            example:
              name: Marek Nowak
              number: 9
              position: napastnik
      responses:
        '201':
          description: Zawodnik dodany
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Player' }
              example:
                data: { id: 1, teamId: 1, name: Marek Nowak, number: 9, position: napastnik }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /players/{player}:
    parameters:
      - { $ref: '#/components/parameters/PlayerId' }
    patch:
      tags: [Players]
      summary: Zmień zawodnika
      description: |
        `number`, `name` i `position` podlegają tym samym zasadom co przy
        `POST /teams/{team}/players`, a konflikt numerów daje `422` z błędem
        pod `number`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 1, maxLength: 120 }
                number: { type: [integer, 'null'], minimum: 0, maximum: 999 }
                position: { type: [string, 'null'], maxLength: 60 }
      responses:
        '200':
          description: Zawodnik po zmianie
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Player' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Players]
      summary: Usuń zawodnika
      description: |
        Daje `422` z błędem pod `id`, jeżeli zawodnik ma zdarzenie w meczu
        rozegranym albo trwającym (`finished` albo `live`): usunięcie
        zmieniłoby klasyfikację strzelców wstecz. Odmowa niczego nie zmienia.
      responses:
        '204': { description: Usunięto }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/DeleteBlocked' }

  /tournaments/{tournament}/venues:
    parameters:

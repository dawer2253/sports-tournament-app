  /matches/{match}:
    parameters:
      - { $ref: '#/components/parameters/MatchId' }
    patch:
      tags: [Matches]
      summary: Wpisz wynik, zmień stan, termin albo obiekt meczu
      description: |
        Częściowa zmiana meczu: wynik i stan (reguły z #159), karne meczu
        pucharowego (#216), a także korekta terminu i obiektu (#158). Pole
        nieobecne zostaje bez zmian. Reguły spójności, klucze `homeScore`
        i `homePenalties` oraz to, że termin i obiekt wolno zmieniać przy
        każdym stanie, opisuje `MatchUpdate`.

        **Awans** w drabince (szczegóły w `MatchUpdate`): mecz `finished`
        wpuszcza zwycięzcę do `winnerToMatchId`, a przegranego do
        `loserToMatchId`, na stronę `advancesToSlot`. Zmiana zwycięzcy albo
        powrót z `finished` podmienia lub zeruje ten slot w obu meczach
        zależnych w tej samej transakcji, a gdy któryś z nich jest `live` albo
        `finished`, cała zmiana daje `422` i nic się nie zapisuje. Poprawka bez
        zmiany zwycięzcy niczego dalej nie rusza. Mecz bez obu drużyn może być
        tylko `scheduled`.

        Odpowiedź niesie tylko zmieniony mecz; mecze zależne klient odświeża
        listą meczów fazy.

        Odpowiedź to ten sam `AdminMatch`, co na liście meczów, więc okno meczu
        dostaje po zapisie świeże kolizje bez osobnego odczytu.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MatchUpdate' }
            examples:
              wynik:
                summary: Mecz zakończony z wynikiem
                value: { status: finished, homeScore: 3, awayScore: 1 }
              terminIObiekt:
                summary: Korekta terminu i obiektu bez zmiany wyniku
                value: { kickoffAt: '2026-10-11T10:00:00+02:00', venueId: 2 }
              karne:
                summary: Remis w meczu pucharowym rozstrzygnięty karnymi
                value: { status: finished, homeScore: 1, awayScore: 1, homePenalties: 4, awayPenalties: 3 }
      responses:
        '200':
          description: Mecz po zmianie
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/AdminMatch' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: Wynik albo karne niespójne ze stanem, mecz ze zdarzeniami cofany do `scheduled`, mecz bez obu drużyn rozpoczynany, zmiana zwycięzcy przy rozpoczętym meczu zależnym, obcy obiekt albo niepoprawne ciało
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }
              examples:
                scheduledZWynikiem:
                  summary: Powrót do `scheduled` bez jawnego wyczyszczenia wyniku
                  value:
                    message: 'Mecz zaplanowany nie ma wyniku. Wyczyść oba pola: homeScore i awayScore.'
                    errors:
                      homeScore: ['Mecz zaplanowany nie ma wyniku. Wyczyść oba pola: homeScore i awayScore.']
                remisBezRemisow:
                  summary: 'Remis przy allowsDraw: false na meczu finished'
                  value:
                    message: 'Ten sport nie zna remisu, więc mecz zakończony musi mieć zwycięzcę.'
                    errors:
                      homeScore: ['Ten sport nie zna remisu, więc mecz zakończony musi mieć zwycięzcę.']
                scheduledZeZdarzeniami:
                  summary: Powrót do `scheduled` meczu, który ma zdarzenia
                  value:
                    message: Mecz ma zdarzenia. Usuń je, zanim cofniesz mecz do zaplanowanych.
                    errors:
                      status: [Mecz ma zdarzenia. Usuń je, zanim cofniesz mecz do zaplanowanych.]
                remisBezKarnych:
                  summary: 'Remis finished w fazie knockout bez karnych'
                  value:
                    message: 'Remis w meczu pucharowym rozstrzygają karne. Wpisz je.'
                    errors:
                      homePenalties: ['Remis w meczu pucharowym rozstrzygają karne. Wpisz je.']
                karnePozaPucharem:
                  summary: 'Karne w meczu fazy innej niż knockout'
                  value:
                    message: 'Karne wpisuje się tylko w meczu pucharowym.'
                    errors:
                      homePenalties: ['Karne wpisuje się tylko w meczu pucharowym.']
                karneBezRemisu:
                  summary: 'Karne przy wyniku innym niż remis albo przy live, także 1:1 (k. 4:3) zmienione na 2:1 bez jawnego null w karnych'
                  value:
                    message: 'Karne należą tylko do remisu w meczu zakończonym. Wyczyść oba pola: homePenalties i awayPenalties.'
                    errors:
                      homePenalties: ['Karne należą tylko do remisu w meczu zakończonym. Wyczyść oba pola: homePenalties i awayPenalties.']
                jedneKarne:
                  summary: 'Jedno pole karnych puste'
                  value:
                    message: 'Wpisz karne obu drużyn.'
                    errors:
                      homePenalties: ['Wpisz karne obu drużyn.']
                karneRemisowe:
                  summary: 'Karne bez zwycięzcy'
                  value:
                    message: 'Karne muszą wyłonić zwycięzcę.'
                    errors:
                      homePenalties: ['Karne muszą wyłonić zwycięzcę.']
                meczBezRywali:
                  summary: 'live albo finished w meczu bez obu drużyn'
                  value:
                    message: 'Mecz czeka na rywali z poprzedniej rundy.'
                    errors:
                      status: ['Mecz czeka na rywali z poprzedniej rundy.']
                blokadaAwansu:
                  summary: 'Zmiana zwycięzcy przy rozpoczętym meczu zależnym (pod status, gdy ciało niesie sam stan)'
                  value:
                    message: 'Zwycięzca zagrał już dalej: Finał (Wilki Bemowo – Orły Bielany), Mecz o 3. miejsce (Rysie Wola – Żubry Praga). Cofnij te mecze do zaplanowanych, zanim zmienisz zwycięzcę.'
                    errors:
                      homeScore: ['Zwycięzca zagrał już dalej: Finał (Wilki Bemowo – Orły Bielany), Mecz o 3. miejsce (Rysie Wola – Żubry Praga). Cofnij te mecze do zaplanowanych, zanim zmienisz zwycięzcę.']

  /matches/{match}/events:
    parameters:
      - { $ref: '#/components/parameters/MatchId' }
    get:
      tags: [MatchEvents]
      summary: Zdarzenia meczu
      description: |
        Pełna lista, bez stronicowania: `minute` rosnąco, zdarzenia bez minuty
        na końcu, a przy tej samej minucie (albo jej braku) `id` rosnąco.

        Przykłady są dwa, po jednym na sport: `pilka` (domyślny) i `koszykowka`.
        Mock zwraca drugi po wysłaniu nagłówka `Prefer: example=koszykowka`, tak
        jak listę meczów i turniej, więc panel na mocku pokazuje oba sporty.
      responses:
        '200':
          description: Zdarzenia meczu
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/MatchEvent' }
              examples:
                pilka:
                  summary: Mecz 1 ligi piłkarskiej, Wilki Bemowo – Sokoły Ursus 2:1
                  description: |
                    Zgodny z seedem demo. Samobój Tomasza Lisa należy do jego
                    drużyny (Sokoły), choć bramkę dostają Wilki; do klasyfikacji
                    się nie wlicza (`stat: null`).
                  value:
                    data:
                      - id: 1
                        team: { id: 1, name: Wilki Bemowo, logoUrl: null }
                        player: { id: 1, name: Marek Nowak }
                        type: goal
                        typeLabel: Bramka
                        minute: 12
                      - id: 3
                        team: { id: 2, name: Sokoły Ursus, logoUrl: null }
                        player: { id: 5, name: Adam Zieliński }
                        type: goal
                        typeLabel: Bramka
                        minute: 34
                      - id: 2
                        team: { id: 2, name: Sokoły Ursus, logoUrl: null }
                        player: { id: 4, name: Tomasz Lis }
                        type: own_goal
                        typeLabel: Bramka samobójcza
                        minute: 58
                      - id: 4
                        team: { id: 2, name: Sokoły Ursus, logoUrl: null }
                        player: { id: 4, name: Tomasz Lis }
                        type: yellow_card
                        typeLabel: Żółta kartka
                        minute: 71
                koszykowka:
                  summary: Mecz 1 ligi koszykówki, Żubry Wola – Rysie Mokotów 90:70 (fragment)
                  description: |
                    Skrócony do kilku zdarzeń: w seedzie demo rzutów jest tyle,
                    że ich `value` sumuje się do wyniku meczu. Ostatnie zdarzenie
                    nie ma minuty, więc stoi na końcu.
                  value:
                    data:
                      - id: 41
                        team: { id: 4, name: Żubry Wola, logoUrl: null }
                        player: { id: 10, name: Kacper Lipa }
                        type: two_pointer
                        typeLabel: Rzut za 2

                        typeLabel: Rzut za 3
                        minute: 2
                      - id: 43
                        team: { id: 4, name: Żubry Wola, logoUrl: null }
                        player: { id: 11, name: Oskar Dąb }
                        type: foul
                        typeLabel: Faul
                        minute: 4
                      - id: 44
                        team: { id: 5, name: Rysie Mokotów, logoUrl: null }

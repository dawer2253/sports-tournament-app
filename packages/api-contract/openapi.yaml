openapi: 3.1.0

info:
  title: Sports Tournament API
  version: 0.4.0
  description: |
    Kontrakt REST API aplikacji do prowadzenia turniejów sportowych.

    Ten plik jest jedynym źródłem prawdy o kształcie API. Typy TypeScript
    (`packages/api-client`) są z niego generowane, backend dowodzi zgodności
    testami, a mock dla frontendu stoi na przykładach zapisanych niżej.
    Nie opisuj tu zachowań, których backend nie realizuje: spec nie jest
    listą życzeń.

    ## Zakres v0.1

    Warstwa platformy (konta, turnieje, drużyny, zawodnicy, obiekty, sporty)
    oraz odczyt meczów, tabel i strony publicznej. Endpointy silnika rozgrywek
    (generowanie terminarza, wpisywanie wyniku, zdarzenia meczowe, drabinka)
    wchodzą w v0.2, ale kształty `Match`, `StandingRow` i `Round` są już
    zamrożone, żeby ich dołożenie nie było zmianą łamiącą.

    Grupy są poza zakresem v0.1: nie ma czym utworzyć grupy, więc `groupId`
    występuje wyłącznie w odczycie i zawsze jest `null`. Kształty, które je
    niosą (`Stage.groups`, `Team.groupId`, `Match.groupId`,
    `StandingTable.groupId`), zostają nietknięte — tak przewiduje
    [ADR-0002](../../docs/adr/0002-faza-istnieje-zawsze.md).

    ## Konwencje

    - Pola w `camelCase`.
    - Odpowiedź zawsze w kopercie: `{ "data": ... }`, listy stronicowane
      dodatkowo `{ "meta": ... }`.
    - Błąd walidacji: `422` z `{ "message": ..., "errors": { pole: [...] } }`.
      Pozostałe błędy: `{ "message": ... }`.
    - Poza kodami wypisanymi przy ścieżkach każde żądanie może dostać
      `400` (`BadRequest`), `405` (`MethodNotAllowed`), `413`
      (`PayloadTooLarge`), `500` (`ServerError`) albo `503`
      (`ServiceUnavailable`) — w tej samej kopercie, po polsku. `message`
      zależy wyłącznie od kodu, nie od przyczyny: jedno zdanie na kod, tak jak
      przy `401`, `403` i `404`. Typowe przyczyny to kolejno niepoprawny
      UTF-8 w ścieżce, metoda spoza obsługiwanych (te niesie nagłówek
      `Allow`), ciało ponad limit serwera, nieoczekiwany błąd i tryb
      konserwacji. Przy `500` `message` nie niesie szczegółów. Teksty są
      w `components/responses`; przy ścieżkach ich nie powtarzamy.
    - Daty w ISO 8601 z offsetem. **W odpowiedziach offset jest zawsze
      `+00:00`** — czas idzie w UTC. Przeliczenie na czas lokalny należy do
      klienta i musi brać pod uwagę zmianę czasu: różnica względem czasu
      polskiego nie jest stała, więc nie zaszywaj jej na sztywno. Powody:
      [ADR-0008](../../docs/adr/0008-czas-w-api-idzie-w-utc.md).
    - Parametr zapytania będący tablicą jedzie rozdzielony przecinkiem
      (`style: form`, `explode: false`), np. `?status=draft,active`. Obowiązuje
      to każdy taki parametr, bo `packages/api-client` ustawia serializację raz,
      globalnie — parametr opisany inaczej rozjechałby się z klientem po cichu,
      a bramka CI tego nie złapie: `openapi-typescript` nie przenosi `style` ani
      `explode` do typów. Powód wyboru przecinka: ADR-0009.
    - Autoryzacja: token Bearer w nagłówku `Authorization`. Endpointy
      `/public/*` są bez autoryzacji.
    - Stronicowane są lista turniejów i panelowa lista meczów turnieju. Pozostałe
      kolekcje w obrębie jednego turnieju (drużyny, zawodnicy, obiekty) oraz
      wszystkie endpointy publiczne wracają w całości.
    - Strona publiczna odpytuje część endpointów `/public/*` cyklicznie, więc
      walidator niesie każdy z nich — jednakowo, żeby zachowanie nie zależało
      od tego, który widok akurat go użyje. Odpowiedź ma `ETag` i
      `Cache-Control` z `no-cache`, a na zgodny `If-None-Match` wraca `304`
      z pustym ciałem. To jedyne miejsce w kontrakcie, które opisuje
      nagłówki odpowiedzi — powód siedzi w
      [ADR-0007](../../docs/adr/0007-odswiezanie-strony-publicznej-na-walidatorach-http.md).

servers:
  - url: http://localhost:8000/api/v1
    description: Lokalny backend (Sail)
  - url: http://localhost:4010
    description: Mock kontraktu (Prism)

tags:
  - name: Auth
    description: Rejestracja, logowanie, sesja organizera.
  - name: Sports
    description: Predefiniowane sporty i ich konfiguracja.
  - name: Tournaments
    description: Turnieje organizera.
  - name: Teams
    description: Drużyny w turnieju.
  - name: Players
    description: Zawodnicy drużyny.
  - name: Venues
    description: Obiekty w turnieju.
  - name: Schedule
    description: Terminarz fazy — generowanie kolejek i meczów.
  - name: Matches
    description: Zapis meczu — wynik, stan, termin i obiekt.
  - name: MatchEvents
    description: Zdarzenia meczu — bramki, kartki, rzuty i faule.
  - name: Reads
    description: Odczyt meczów i tabel po stronie panelu.
  - name: Public
    description: Publiczna strona turnieju, bez autoryzacji.

security:
  - bearerAuth: []

paths:
  /register:
    post:
      tags: [Auth]
      summary: Załóż konto organizera
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password, passwordConfirmation]
              properties:
                name: { type: string, minLength: 2, maxLength: 120 }
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
                passwordConfirmation: { type: string, minLength: 8 }
            example:
              name: Dawid Patko
              email: dawid@example.com
              password: tajnehaslo123
              passwordConfirmation: tajnehaslo123
      responses:
        '201':
          description: Konto założone, token wydany
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/AuthPayload' }
              example:
                data:
                  token: 1|4bT9xQkR7fN2wUhLpVmZaCdEfGhIjKlMnOpQrStU1a2b3c4d
                  user:
                    id: 1
                    name: Dawid Patko
                    email: dawid@example.com
                    createdAt: '2026-09-01T08:00:00+00:00'
        '422': { $ref: '#/components/responses/ValidationError' }

  /login:
    post:
      tags: [Auth]
      summary: Zaloguj się
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
            example:
              email: dawid@example.com
              password: tajnehaslo123
      responses:
        '200':
          description: Token wydany
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/AuthPayload' }
              example:
                data:
                  token: 1|4bT9xQkR7fN2wUhLpVmZaCdEfGhIjKlMnOpQrStU1a2b3c4d
                  user:
                    id: 1
                    name: Dawid Patko
                    email: dawid@example.com
                    createdAt: '2026-09-01T08:00:00+00:00'
        '422': { $ref: '#/components/responses/ValidationError' }

  /logout:
    post:
      tags: [Auth]
      summary: Unieważnij bieżący token
      responses:
        '204': { description: Wylogowano }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /me:
    get:
      tags: [Auth]
      summary: Zalogowany organizer
      description: Używane przy starcie panelu do odtworzenia sesji z zapisanego tokenu.
      responses:
        '200':
          description: Dane konta
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/User' }
              example:
                data:
                  id: 1
                  name: Dawid Patko
                  email: dawid@example.com
                  createdAt: '2026-09-01T08:00:00+00:00'
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /sports:
    get:
      tags: [Sports]
      summary: Lista sportów wraz z konfiguracją
      description: |
        Panel korzysta z `config`, żeby wiedzieć, jakie rodzaje zdarzeń, tiebreaki
        i statystyki są dopuszczalne dla danego sportu. Backend waliduje to samo
        po swojej stronie: lista na froncie jest wygodą, nie zabezpieczeniem.
      responses:
        '200':
          description: Sporty predefiniowane w systemie
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Sport' }
              example:
                data:
                  - id: 1
                    code: football
                    name: Piłka nożna
                    config:
                      allowsDraw: true
                      defaultPoints: { win: 3, draw: 1, loss: 0 }
                      defaultMatchDuration: 60
                      defaultPeriods: { count: 2, minutes: 45 }
                      eventTypes:
                        - { code: goal, label: Bramka, hasPlayer: true, value: 1, stat: goals }
                        - { code: own_goal, label: Bramka samobójcza, hasPlayer: true, value: 1, stat: null }
                        - { code: yellow_card, label: Żółta kartka, hasPlayer: true, value: 1, stat: yellowCards }
                        - { code: red_card, label: Czerwona kartka, hasPlayer: true, value: 1, stat: redCards }
                      defaultTiebreakers: [points, head_to_head, score_diff, score_for]
                      availableTiebreakers: [points, head_to_head, score_diff, score_for, wins]
                      tiebreakerLabels:
                        points: Punkty w tabeli
                        head_to_head: Bezpośredni mecz
                        score_diff: Różnica bramek
                        score_for: Bramki zdobyte
                        wins: Zwycięstwa
                      availableStats: [goals, yellowCards, redCards]
                      statLabels:
                        goals: Bramki
                        yellowCards: Żółte kartki
                        redCards: Czerwone kartki
                  - id: 2
                    code: basketball
                    name: Koszykówka
                    config:
                      allowsDraw: false
                      defaultPoints: { win: 2, draw: 0, loss: 1 }
                      defaultMatchDuration: 40
                      defaultPeriods: { count: 4, minutes: 10 }
                      eventTypes:
                        - { code: free_throw, label: Rzut wolny, hasPlayer: true, value: 1, stat: points }
                        - { code: two_pointer, label: Rzut za 2, hasPlayer: true, value: 2, stat: points }
                        - { code: three_pointer, label: Rzut za 3, hasPlayer: true, value: 3, stat: points }
                        - { code: foul, label: Faul, hasPlayer: true, value: 1, stat: fouls }
                      defaultTiebreakers: [points, head_to_head, score_diff]
                      availableTiebreakers: [points, head_to_head, score_diff, score_for, wins]
                      tiebreakerLabels:
                        points: Punkty w tabeli
                        head_to_head: Bezpośredni mecz
                        score_diff: Różnica punktów
                        score_for: Zdobyte punkty
                        wins: Zwycięstwa
                      availableStats: [points, fouls]
                      statLabels:
                        points: Punkty
                        fouls: Faule
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /tournaments:
    get:
      tags: [Tournaments]
      summary: Turnieje zalogowanego organizera
      description: |
        Od najnowszego: `createdAt` malejąco, a turnieje założone w tej samej
        chwili rozstrzyga `id`, też malejąco. Kolejność jest przez to stabilna
        między stronami — żaden turniej nie wypada ani nie dubluje się na
        granicy strony.
      parameters:
        - name: status
          in: query
          description: |
            Zawęża listę do podanych stanów, np. `draft,active`. Bez parametru
            odpowiedź obejmuje wszystkie turnieje organizera. Filtr działa przed
            stronicowaniem, więc `meta` opisuje zbiór już zawężony.

            Wartość spoza `TournamentStatus`, powtórzona albo pusta daje `422` —
            to literówka w adresie, nie prośba o brak filtra. Dlaczego lista po
            przecinku, a nie pojedyncza wartość ani powtórzony klucz: ADR-0009
            (`docs/adr/0009-filtr-status-jedzie-lista-po-przecinku.md`).
          required: false
          style: form
          explode: false
          schema:
            type: array
            minItems: 1
            uniqueItems: true
            items: { $ref: '#/components/schemas/TournamentStatus' }
          example: [draft, active]
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: perPage, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: Stronicowana lista turniejów, opcjonalnie zawężona do podanych stanów
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Tournament' }
                  meta: { $ref: '#/components/schemas/PaginationMeta' }
              example:
                data:
                  - id: 2
                    name: Puchar Zimowy
                    slug: puchar-zimowy
                    status: draft
                    sport: { id: 2, code: basketball, name: Koszykówka }
                    branding: { logoUrl: null, primaryColor: '#1F7A45' }
                    points: { win: 2, draw: 0, loss: 1 }
                    tiebreakers: [points, head_to_head, score_diff]
                    matchDuration: 40
                    periods: { count: 4, minutes: 10 }
                    teamsCount: 8
                    createdAt: '2026-09-10T07:00:00+00:00'
                    updatedAt: '2026-09-10T07:00:00+00:00'
                  - id: 1
                    name: Liga Osiedlowa 2026
                    slug: liga-osiedlowa-2026
                    status: active
                    sport: { id: 1, code: football, name: Piłka nożna }
                    branding: { logoUrl: null, primaryColor: '#1F7A45' }
                    points: { win: 3, draw: 1, loss: 0 }
                    tiebreakers: [points, head_to_head, score_diff, score_for]
                    matchDuration: 60
                    periods: { count: 2, minutes: 45 }
                    teamsCount: 3
                    createdAt: '2026-09-01T08:00:00+00:00'
                    updatedAt: '2026-09-14T16:30:00+00:00'
                meta: { currentPage: 1, lastPage: 1, perPage: 20, total: 2 }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [Tournaments]
      summary: Załóż turniej
      description: |
        `format` nie jest zapisywanym polem turnieju, tylko wskazówką, jakie fazy
        (`Stage`) utworzyć przy zakładaniu. Po utworzeniu prawdą o strukturze
        turnieju są wyłącznie jego fazy.

        `slug` jest generowany z nazwy i można go później zmienić.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TournamentCreate' }
            example:
              name: Liga Osiedlowa 2026
              sportId: 1
              format: league
      responses:
        '201':
          description: Turniej założony
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Tournament' }
              example:
                data:
                  id: 1
                  name: Liga Osiedlowa 2026
                  slug: liga-osiedlowa-2026
                  status: draft
                  sport: { id: 1, code: football, name: Piłka nożna }
                  branding: { logoUrl: null, primaryColor: '#1F7A45' }
                  points: { win: 3, draw: 1, loss: 0 }
                  tiebreakers: [points, head_to_head, score_diff, score_for]
                  matchDuration: 60
                  periods: { count: 2, minutes: 45 }
                  teamsCount: 0
                  createdAt: '2026-09-01T08:00:00+00:00'
                  updatedAt: '2026-09-01T08:00:00+00:00'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /tournaments/{tournament}:
    parameters:
      - { $ref: '#/components/parameters/TournamentId' }
    get:
      tags: [Tournaments]
      summary: Szczegóły turnieju
      description: |
        Przykłady są dwa, po jednym na sport: `pilka` (domyślny) i `koszykowka`.
        Mock zwraca drugi po wysłaniu nagłówka `Prefer: example=koszykowka` —
        ten sam przełącznik obsługuje listę meczów i tabelę, więc w panelu
        przestawia naraz turniej, terminarz i tabelę. Turniej koszykarski to
        ten z seedu demo (`liga-koszykowki-2026`).
      responses:
        '200':
          description: Turniej
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Tournament' }
              examples:
                pilka:
                  summary: Turniej piłkarski — zgodny z seedem demo
                  value:
                    data:
                      id: 1
                      name: Liga Osiedlowa 2026
                      slug: liga-osiedlowa-2026
                      status: active
                      sport: { id: 1, code: football, name: Piłka nożna }
                      branding: { logoUrl: null, primaryColor: '#1F7A45' }
                      points: { win: 3, draw: 1, loss: 0 }
                      tiebreakers: [points, head_to_head, score_diff, score_for]
                      matchDuration: 60
                      periods: { count: 2, minutes: 45 }
                      teamsCount: 3
                      createdAt: '2026-09-01T08:00:00+00:00'
                      updatedAt: '2026-09-14T16:30:00+00:00'
                koszykowka:
                  summary: Turniej koszykarski — zgodny z tabelą i listą meczów
                  value:
                    data:
                      id: 2
                      name: Liga Koszykówki 2026
                      slug: liga-koszykowki-2026
                      status: active
                      sport: { id: 2, code: basketball, name: Koszykówka }
                      branding: { logoUrl: null, primaryColor: '#1F7A45' }
                      points: { win: 2, draw: 0, loss: 1 }
                      tiebreakers: [points, head_to_head, score_diff]
                      matchDuration: 40
                      periods: { count: 4, minutes: 10 }
                      teamsCount: 2
                      createdAt: '2026-09-01T08:00:00+00:00'
                      updatedAt: '2026-09-14T16:30:00+00:00'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Tournaments]
      summary: Zmień ustawienia turnieju
      description: |
        Obsługuje też zmianę listy i kolejności tiebreaków (`tiebreakers`) i zmianę
        `slug`. Zmiana `slug` unieważnia dotychczasowy publiczny adres turnieju:
        panel musi o tym ostrzec przed zapisem.

        Zmienia też `status` (znaczenie stanów i to, kto je ustawia:
        `TournamentStatus`). Przejścia między stanami są dowolne i nie mają
        warunków wstępnych. Jedyny zakaz: turniej, który ma mecz rozegrany
        albo trwający (`finished` albo `live`), nie przechodzi do `draft`
        z innego stanu — taka próba daje `422`
        z błędem pod `status`. Wysłanie `draft` turniejowi, który już jest
        w `draft`, nie jest przejściem, więc zakaz go nie dotyczy.

        Punktację (`points`) i tiebreaki (`tiebreakers`) wolno zmieniać zawsze,
        niezależnie od statusu turnieju i od rozegranych meczów. Tabela liczy
        się przy odczycie, więc zmiana obejmuje też mecze już rozegrane.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TournamentUpdate' }
            example:
              name: Liga Osiedlowa 2026/27
              tiebreakers: [points, score_diff, head_to_head, score_for]
      responses:
        '200':
          description: Turniej po zmianie
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Tournament' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Tournaments]
      summary: Usuń turniej
      description: |
        Usuwa turniej na twardo razem z całym poddrzewem: drużynami (także
        usuniętymi wcześniej), zawodnikami, obiektami, fazami i meczami, oraz
        z plikami logo i herbów. Operacji nie da się cofnąć, a `slug` od razu
        się zwalnia.

        Odrzucane z kodem `422`, jeżeli turniej ma choć jeden mecz rozegrany
        albo trwający (`finished` albo `live`): jego publiczny adres ma
        działać dalej. Status turnieju nie ma tu znaczenia.
      responses:
        '204': { description: Usunięto }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/DeleteBlocked' }

  /tournaments/{tournament}/logo:
    parameters:
      - { $ref: '#/components/parameters/TournamentId' }
    post:
      tags: [Tournaments]
      summary: Wgraj logo turnieju
      description: |
        Przyjmuje PNG, JPG albo WebP o rozmiarze do 2 MB i wymiarach od 64×64
        do 4096×4096 pikseli, bez wymogu proporcji. O formacie decyduje treść
        pliku, nie nazwa ani rozszerzenie. Obraz jest zapisywany bez
        przetwarzania.

        Nowy plik zastępuje poprzedni, a poprzedni jest kasowany. Każdy upload
        daje nowy `logoUrl`, więc dotychczasowy adres przestaje działać.
        Naruszenie daje `422` pod `logo`.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [logo]
              properties:
                logo: { type: string, format: binary }
      responses:
        '200':
          description: Turniej z nowym logo
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Tournament' }
              example:
                data:
                  id: 1
                  name: Liga Osiedlowa 2026
                  slug: liga-osiedlowa-2026
                  status: draft
                  sport: { id: 1, code: football, name: Piłka nożna }
                  branding: { logoUrl: http://localhost:8000/storage/tournaments/1/logo/hMbkow7jZDUOi8YzukrkRzF1eY8wqM7DJtNlFrEZ.png, primaryColor: '#1F7A45' }

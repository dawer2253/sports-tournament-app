        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [MatchEvents]
      summary: Dodaj zdarzenie meczu
      description: |
        Reguły zapisu opisuje `MatchEventCreate`. Zapis do meczu `scheduled`
        daje `422` pod `match`; mecz `live` i `finished` przyjmuje zdarzenia
        zawsze, bez ostrzeżenia. Stan turnieju niczego nie blokuje.

        Zdarzenie nie zmienia wyniku meczu ani tabeli: wynik wpisuje się osobno
        (`PATCH /matches/{match}`), a API nie sprawdza zgodności liczby bramek
        z wynikiem.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MatchEventCreate' }
            example: { type: goal, teamId: 1, playerId: 1, minute: 63 }
      responses:
        '201':
          description: Zdarzenie dodane
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/MatchEvent' }
              example:
                data:
                  id: 41
                  team: { id: 1, name: Wilki Bemowo, logoUrl: null }
                  player: { id: 1, name: Marek Nowak }
                  type: goal
                  typeLabel: Bramka
                  minute: 63
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/MatchEventInvalid' }

  /match-events/{event}:
    parameters:
      - { $ref: '#/components/parameters/MatchEventId' }
    patch:
      tags: [MatchEvents]
      summary: Popraw zdarzenie meczu
      description: |
        Częściowa zmiana: typ, drużyna, zawodnik albo minuta, bez kasowania
        zdarzenia. Ciało jest walidowane **po scaleniu** z zapisanym
        zdarzeniem tymi samymi regułami co przy dodawaniu, więc sama zmiana
        `teamId` na drużynę przeciwną przy zostawionym zawodniku daje `422`
        pod `playerId`. Zdarzenie meczu `scheduled` daje `422` pod `match`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MatchEventUpdate' }
            example: { minute: 93 }
      responses:
        '200':
          description: Zdarzenie po zmianie
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/MatchEvent' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/MatchEventInvalid' }
    delete:
      tags: [MatchEvents]
      summary: Usuń zdarzenie meczu
      description: Zdarzenie meczu `scheduled` daje `422` pod `match`; przy `live` i `finished` usunięcie przechodzi zawsze.
      responses:
        '204': { description: Usunięto }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: Mecz jest zaplanowany
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }
              example:
                message: Zdarzenia wpisuje się w meczu trwającym albo zakończonym.
                errors:
                  match: [Zdarzenia wpisuje się w meczu trwającym albo zakończonym.]

  /tournaments/{tournament}/standings:
    parameters:
      - { $ref: '#/components/parameters/TournamentId' }
    get:
      tags: [Reads]
      summary: Tabele turnieju
      description: |
        Tabela nie jest bytem zapisywanym: jest liczona przy każdym odczycie
        z zakończonych meczów. Mecz trwający (`live`) się nie liczy. Jedna
        pozycja na fazę `league` i jedna na każdą grupę w fazie `group`. Faza
        `knockout` nie ma tabeli.

        Tabela zawiera komplet drużyn fazy, także tych, które nie rozegrały
        jeszcze meczu: dostają wiersz z zerami. Przed pierwszym meczem i w fazie
        bez terminarza są to wszystkie drużyny fazy alfabetycznie, a nie pusta
        lista. Drużyny usunięte nie mają wiersza.

        Kolejność ustala lista `Tournament.tiebreakers` (znaczenie kryteriów:
        `TiebreakerCode`), a po niej ukryte ostatnie kryterium: nazwa drużyny,
        alfabetycznie po polsku, bez rozróżniania wielkości liter.

        Przykłady są dwa, po jednym na sport, te same co w
        `/public/t/{slug}/standings`: `pilka` (domyślny, zgodny z seedem demo)
        i `koszykowka`. Mock zwraca drugi po wysłaniu nagłówka
        `Prefer: example=koszykowka`. Drugi przykład jest tu po to, żeby dało
        się sprawdzić, czy panel bierze nagłówek kolumny z odpowiedzi, a nie ze
        sztywnego napisu. `GET /tournaments/{tournament}` i lista meczów panelu
        mają ten sam przełącznik, więc w panelu przestawia naraz turniej,
        terminarz i tabelę. Mock nie liczy tabel, więc parametr `tiebreakers`
        niczego w nim nie zmienia.
      parameters:
        - name: tiebreakers
          in: query
          description: |
            Podgląd: liczy tabele według podanej listy kryteriów zamiast
            zapisanej w turnieju i **niczego nie zapisuje**. Panel pokazuje
            dzięki temu skutek nowej kolejności przed zapisem. Bez parametru
            odpowiedź liczy się według `Tournament.tiebreakers`.

            Lista podlega tym samym regułom co `tiebreakers` w
            `PATCH /tournaments/{tournament}` (`TournamentUpdate`) i daje te
            same błędy `422` pod tymi samymi kluczami: `tiebreakers.N` przy
            elemencie, `tiebreakers.0` przy braku `points` na początku,
            `tiebreakers` przy pustej wartości. Powtórzony klucz i notacja
            nawiasowa (`tiebreakers[]=`) dają `422` pod `tiebreakers` (ADR-0009).
          required: false
          style: form
          explode: false
          schema:
            type: array
            minItems: 1
            uniqueItems: true
            items: { $ref: '#/components/schemas/TiebreakerCode' }
          example: [points, score_diff, head_to_head]
      responses:
        '200':
          description: Tabele w kolejności faz
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/StandingTable' }
              examples:
                pilka:
                  summary: Turniej piłkarski — zdobycze to bramki
                  value:
                    data:
                      - stageId: 1
                        stageName: Faza zasadnicza
                        groupId: null
                        groupName: null
                        scoreLabel: Bramki
                        allowsDraw: true
                        tiebreakers:
                          - { code: points, label: Punkty w tabeli }
                          - { code: head_to_head, label: Bezpośredni mecz }
                          - { code: score_diff, label: Różnica bramek }
                          - { code: score_for, label: Bramki zdobyte }
                        rows:
                          - { position: 1, team: { id: 1, name: Wilki Bemowo, logoUrl: null }, played: 2, won: 2, drawn: 0, lost: 0, scoreFor: 5, scoreAgainst: 1, scoreDifference: 4, points: 6 }
                          - { position: 2, team: { id: 2, name: Sokoły Ursus, logoUrl: null }, played: 2, won: 1, drawn: 0, lost: 1, scoreFor: 3, scoreAgainst: 3, scoreDifference: 0, points: 3 }
                          - { position: 3, team: { id: 3, name: Orły Bielany, logoUrl: null }, played: 2, won: 0, drawn: 0, lost: 2, scoreFor: 1, scoreAgainst: 5, scoreDifference: -4, points: 0 }
                koszykowka:
                  summary: Turniej koszykarski — zdobycze to punkty
                  description: |
                    Turniej koszykarski z seedu demo (`liga-koszykowki-2026`),
                    zgodny z przykładem `koszykowka` w
                    `GET /tournaments/{tournament}` i na liście meczów panelu.
                  value:
                    data:
                      - stageId: 1
                        stageName: Faza zasadnicza
                        groupId: null
                        groupName: null
                        scoreLabel: Punkty
                        allowsDraw: false
                        tiebreakers:
                          - { code: points, label: Punkty w tabeli }
                          - { code: head_to_head, label: Bezpośredni mecz }
                          - { code: score_diff, label: Różnica punktów }
                        rows:
                          - { position: 1, team: { id: 4, name: Żubry Wola, logoUrl: null }, played: 2, won: 2, drawn: 0, lost: 0, scoreFor: 168, scoreAgainst: 141, scoreDifference: 27, points: 4 }
                          - { position: 2, team: { id: 5, name: Rysie Mokotów, logoUrl: null }, played: 2, won: 0, drawn: 0, lost: 2, scoreFor: 141, scoreAgainst: 168, scoreDifference: -27, points: 2 }

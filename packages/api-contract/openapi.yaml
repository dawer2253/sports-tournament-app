openapi: 3.1.0

info:
  title: Sports Tournament API
  version: 0.2.0
  description: |
    Kontrakt REST API aplikacji do prowadzenia turniejów sportowych.

    Ten plik jest jedynym źródłem prawdy o kształcie API. Typy TypeScript
    (`packages/api-client`) są z niego generowane, backend dowodzi zgodności
    testami, a mock dla frontendu stoi na przykładach zapisanych niżej.
    Nie opisuj tu zachowań, których backend nie realizuje: spec nie jest
    listą życzeń.

    ## Zakres v0.1

    Warstwa platformy (konta, turnieje, drużyny, zawodnicy, obiekty, sporty)
    oraz odczyt meczów, tabel i strony publicznej. Endpointy silnika rozgrywek
    (generowanie terminarza, wpisywanie wyniku, zdarzenia meczowe, drabinka)
    wchodzą w v0.2, ale kształty `Match`, `StandingRow` i `Round` są już
    zamrożone, żeby ich dołożenie nie było zmianą łamiącą.

    Grupy są poza zakresem v0.1: nie ma czym utworzyć grupy, więc `groupId`
    występuje wyłącznie w odczycie i zawsze jest `null`. Kształty, które je
    niosą (`Stage.groups`, `Team.groupId`, `Match.groupId`,
    `StandingTable.groupId`), zostają nietknięte — tak przewiduje
    [ADR-0002](../../docs/adr/0002-faza-istnieje-zawsze.md).

    ## Konwencje

    - Pola w `camelCase`.
    - Odpowiedź zawsze w kopercie: `{ "data": ... }`, listy stronicowane
      dodatkowo `{ "meta": ... }`.
    - Błąd walidacji: `422` z `{ "message": ..., "errors": { pole: [...] } }`.
      Pozostałe błędy: `{ "message": ... }`.
    - Poza kodami wypisanymi przy ścieżkach każde żądanie może dostać
      `400` (`BadRequest`), `405` (`MethodNotAllowed`), `413`
      (`PayloadTooLarge`), `500` (`ServerError`) albo `503`
      (`ServiceUnavailable`) — w tej samej kopercie, po polsku. `message`
      zależy wyłącznie od kodu, nie od przyczyny: jedno zdanie na kod, tak jak
      przy `401`, `403` i `404`. Typowe przyczyny to kolejno niepoprawny
      UTF-8 w ścieżce, metoda spoza obsługiwanych (te niesie nagłówek
      `Allow`), ciało ponad limit serwera, nieoczekiwany błąd i tryb
      konserwacji. Przy `500` `message` nie niesie szczegółów. Teksty są
      w `components/responses`; przy ścieżkach ich nie powtarzamy.
    - Daty w ISO 8601 z offsetem. **W odpowiedziach offset jest zawsze
      `+00:00`** — czas idzie w UTC. Przeliczenie na czas lokalny należy do
      klienta i musi brać pod uwagę zmianę czasu: różnica względem czasu
      polskiego nie jest stała, więc nie zaszywaj jej na sztywno. Powody:
      [ADR-0008](../../docs/adr/0008-czas-w-api-idzie-w-utc.md).
    - Parametr zapytania będący tablicą jedzie rozdzielony przecinkiem
      (`style: form`, `explode: false`), np. `?status=draft,active`. Obowiązuje
      to każdy taki parametr, bo `packages/api-client` ustawia serializację raz,
      globalnie — parametr opisany inaczej rozjechałby się z klientem po cichu,
      a bramka CI tego nie złapie: `openapi-typescript` nie przenosi `style` ani
      `explode` do typów. Powód wyboru przecinka: ADR-0009.
    - Autoryzacja: token Bearer w nagłówku `Authorization`. Endpointy
      `/public/*` są bez autoryzacji.
    - Stronicowane są lista turniejów i panelowa lista meczów turnieju. Pozostałe
      kolekcje w obrębie jednego turnieju (drużyny, zawodnicy, obiekty) oraz
      wszystkie endpointy publiczne wracają w całości.
    - Strona publiczna odpytuje część endpointów `/public/*` cyklicznie, więc
      walidator niesie każdy z nich — jednakowo, żeby zachowanie nie zależało
      od tego, który widok akurat go użyje. Odpowiedź ma `ETag` i
      `Cache-Control` z `no-cache`, a na zgodny `If-None-Match` wraca `304`
      z pustym ciałem. To jedyne miejsce w kontrakcie, które opisuje
      nagłówki odpowiedzi — powód siedzi w
      [ADR-0007](../../docs/adr/0007-odswiezanie-strony-publicznej-na-walidatorach-http.md).

servers:
  - url: http://localhost:8000/api/v1
    description: Lokalny backend (Sail)
  - url: http://localhost:4010
    description: Mock kontraktu (Prism)

tags:
  - name: Auth
    description: Rejestracja, logowanie, sesja organizera.
  - name: Sports
    description: Predefiniowane sporty i ich konfiguracja.
  - name: Tournaments
    description: Turnieje organizera.
  - name: Teams
    description: Drużyny w turnieju.
  - name: Players
    description: Zawodnicy drużyny.
  - name: Venues
    description: Obiekty w turnieju.
  - name: Schedule
    description: Terminarz fazy — generowanie kolejek i meczów.
  - name: Matches
    description: Zapis meczu — wynik, stan, termin i obiekt.
  - name: Reads
    description: Odczyt meczów i tabel po stronie panelu.
  - name: Public
    description: Publiczna strona turnieju, bez autoryzacji.

security:
  - bearerAuth: []

paths:
  /register:
    post:
      tags: [Auth]
      summary: Załóż konto organizera
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password, passwordConfirmation]
              properties:
                name: { type: string, minLength: 2, maxLength: 120 }
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
                passwordConfirmation: { type: string, minLength: 8 }
            example:
              name: Dawid Patko
              email: dawid@example.com
              password: tajnehaslo123
              passwordConfirmation: tajnehaslo123
      responses:
        '201':
          description: Konto założone, token wydany
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/AuthPayload' }
              example:
                data:
                  token: 1|4bT9xQkR7fN2wUhLpVmZaCdEfGhIjKlMnOpQrStU1a2b3c4d
                  user:
                    id: 1
                    name: Dawid Patko
                    email: dawid@example.com
                    createdAt: '2026-09-01T08:00:00+00:00'
        '422': { $ref: '#/components/responses/ValidationError' }

  /login:
    post:
      tags: [Auth]
      summary: Zaloguj się
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
            example:
              email: dawid@example.com
              password: tajnehaslo123
      responses:
        '200':
          description: Token wydany
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/AuthPayload' }
              example:
                data:
                  token: 1|4bT9xQkR7fN2wUhLpVmZaCdEfGhIjKlMnOpQrStU1a2b3c4d
                  user:
                    id: 1
                    name: Dawid Patko
                    email: dawid@example.com
                    createdAt: '2026-09-01T08:00:00+00:00'
        '422': { $ref: '#/components/responses/ValidationError' }

  /logout:
    post:
      tags: [Auth]
      summary: Unieważnij bieżący token
      responses:
        '204': { description: Wylogowano }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /me:
    get:
      tags: [Auth]
      summary: Zalogowany organizer
      description: Używane przy starcie panelu do odtworzenia sesji z zapisanego tokenu.
      responses:
        '200':
          description: Dane konta
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/User' }
              example:
                data:
                  id: 1
                  name: Dawid Patko
                  email: dawid@example.com
                  createdAt: '2026-09-01T08:00:00+00:00'
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /sports:
    get:
      tags: [Sports]
      summary: Lista sportów wraz z konfiguracją
      description: |
        Panel korzysta z `config`, żeby wiedzieć, jakie rodzaje zdarzeń, tiebreaki
        i statystyki są dopuszczalne dla danego sportu. Backend waliduje to samo
        po swojej stronie: lista na froncie jest wygodą, nie zabezpieczeniem.
      responses:
        '200':
          description: Sporty predefiniowane w systemie
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Sport' }
              example:
                data:
                  - id: 1
                    code: football
                    name: Piłka nożna
                    config:
                      allowsDraw: true
                      defaultPoints: { win: 3, draw: 1, loss: 0 }
                      defaultMatchDuration: 60
                      eventTypes:
                        - { code: goal, label: Bramka, hasPlayer: true, stat: goals }
                        - { code: own_goal, label: Bramka samobójcza, hasPlayer: true, stat: null }
                        - { code: yellow_card, label: Żółta kartka, hasPlayer: true, stat: yellowCards }
                        - { code: red_card, label: Czerwona kartka, hasPlayer: true, stat: redCards }
                      defaultTiebreakers: [points, head_to_head, score_diff, score_for]
                      availableTiebreakers: [points, head_to_head, score_diff, score_for, wins]
                      tiebreakerLabels:
                        points: Punkty w tabeli
                        head_to_head: Bezpośredni mecz
                        score_diff: Różnica bramek
                        score_for: Bramki zdobyte
                        wins: Zwycięstwa
                      availableStats: [goals, yellowCards, redCards]
                  - id: 2
                    code: basketball
                    name: Koszykówka
                    config:
                      allowsDraw: false
                      defaultPoints: { win: 2, draw: 0, loss: 1 }
                      defaultMatchDuration: 40
                      eventTypes:
                        - { code: points, label: Punkty, hasPlayer: true, stat: points }
                        - { code: foul, label: Faul, hasPlayer: true, stat: fouls }
                      defaultTiebreakers: [points, head_to_head, score_diff]
                      availableTiebreakers: [points, head_to_head, score_diff, score_for, wins]
                      tiebreakerLabels:
                        points: Punkty w tabeli
                        head_to_head: Bezpośredni mecz
                        score_diff: Różnica punktów
                        score_for: Zdobyte punkty
                        wins: Zwycięstwa
                      availableStats: [points, fouls]
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /tournaments:
    get:
      tags: [Tournaments]
      summary: Turnieje zalogowanego organizera
      description: |
        Od najnowszego: `createdAt` malejąco, a turnieje założone w tej samej
        chwili rozstrzyga `id`, też malejąco. Kolejność jest przez to stabilna
        między stronami — żaden turniej nie wypada ani nie dubluje się na
        granicy strony.
      parameters:
        - name: status
          in: query
          description: |
            Zawęża listę do podanych stanów, np. `draft,active`. Bez parametru
            odpowiedź obejmuje wszystkie turnieje organizera. Filtr działa przed
            stronicowaniem, więc `meta` opisuje zbiór już zawężony.

            Wartość spoza `TournamentStatus`, powtórzona albo pusta daje `422` —
            to literówka w adresie, nie prośba o brak filtra. Dlaczego lista po
            przecinku, a nie pojedyncza wartość ani powtórzony klucz: ADR-0009
            (`docs/adr/0009-filtr-status-jedzie-lista-po-przecinku.md`).
          required: false
          style: form
          explode: false
          schema:
            type: array
            minItems: 1
            uniqueItems: true
            items: { $ref: '#/components/schemas/TournamentStatus' }
          example: [draft, active]
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: perPage, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: Stronicowana lista turniejów, opcjonalnie zawężona do podanych stanów
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Tournament' }
                  meta: { $ref: '#/components/schemas/PaginationMeta' }
              example:
                data:
                  - id: 2
                    name: Puchar Zimowy
                    slug: puchar-zimowy
                    status: draft
                    sport: { id: 2, code: basketball, name: Koszykówka }
                    branding: { logoUrl: null, primaryColor: '#1F7A45' }
                    points: { win: 2, draw: 0, loss: 1 }
                    tiebreakers: [points, head_to_head, score_diff]
                    matchDuration: 40
                    teamsCount: 8
                    createdAt: '2026-09-10T07:00:00+00:00'
                    updatedAt: '2026-09-10T07:00:00+00:00'
                  - id: 1
                    name: Liga Osiedlowa 2026
                    slug: liga-osiedlowa-2026
                    status: active
                    sport: { id: 1, code: football, name: Piłka nożna }
                    branding: { logoUrl: null, primaryColor: '#1F7A45' }
                    points: { win: 3, draw: 1, loss: 0 }
                    tiebreakers: [points, head_to_head, score_diff, score_for]
                    matchDuration: 60
                    teamsCount: 3
                    createdAt: '2026-09-01T08:00:00+00:00'
                    updatedAt: '2026-09-14T16:30:00+00:00'
                meta: { currentPage: 1, lastPage: 1, perPage: 20, total: 2 }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [Tournaments]
      summary: Załóż turniej
      description: |
        `format` nie jest zapisywanym polem turnieju, tylko wskazówką, jakie fazy
        (`Stage`) utworzyć przy zakładaniu. Po utworzeniu prawdą o strukturze
        turnieju są wyłącznie jego fazy.

        `slug` jest generowany z nazwy i można go później zmienić.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TournamentCreate' }
            example:
              name: Liga Osiedlowa 2026
              sportId: 1
              format: league
      responses:
        '201':
          description: Turniej założony
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Tournament' }
              example:
                data:
                  id: 1
                  name: Liga Osiedlowa 2026
                  slug: liga-osiedlowa-2026
                  status: draft
                  sport: { id: 1, code: football, name: Piłka nożna }
                  branding: { logoUrl: null, primaryColor: '#1F7A45' }
                  points: { win: 3, draw: 1, loss: 0 }
                  tiebreakers: [points, head_to_head, score_diff, score_for]
                  matchDuration: 60
                  teamsCount: 0
                  createdAt: '2026-09-01T08:00:00+00:00'
                  updatedAt: '2026-09-01T08:00:00+00:00'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /tournaments/{tournament}:
    parameters:
      - { $ref: '#/components/parameters/TournamentId' }
    get:
      tags: [Tournaments]
      summary: Szczegóły turnieju
      description: |
        Przykłady są dwa, po jednym na sport: `pilka` (domyślny) i `koszykowka`.
        Mock zwraca drugi po wysłaniu nagłówka `Prefer: example=koszykowka` —
        ten sam przełącznik obsługuje listę meczów i tabelę, więc w panelu
        przestawia naraz turniej, terminarz i tabelę. Turniej koszykarski to
        ten z seedu demo (`liga-koszykowki-2026`).
      responses:
        '200':
          description: Turniej
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Tournament' }
              examples:
                pilka:
                  summary: Turniej piłkarski — zgodny z seedem demo
                  value:
                    data:
                      id: 1
                      name: Liga Osiedlowa 2026
                      slug: liga-osiedlowa-2026
                      status: active
                      sport: { id: 1, code: football, name: Piłka nożna }
                      branding: { logoUrl: null, primaryColor: '#1F7A45' }
                      points: { win: 3, draw: 1, loss: 0 }
                      tiebreakers: [points, head_to_head, score_diff, score_for]
                      matchDuration: 60
                      teamsCount: 3
                      createdAt: '2026-09-01T08:00:00+00:00'
                      updatedAt: '2026-09-14T16:30:00+00:00'
                koszykowka:
                  summary: Turniej koszykarski — zgodny z tabelą i listą meczów
                  value:
                    data:
                      id: 2
                      name: Liga Koszykówki 2026
                      slug: liga-koszykowki-2026
                      status: active
                      sport: { id: 2, code: basketball, name: Koszykówka }
                      branding: { logoUrl: null, primaryColor: '#1F7A45' }
                      points: { win: 2, draw: 0, loss: 1 }
                      tiebreakers: [points, head_to_head, score_diff]
                      matchDuration: 40
                      teamsCount: 2
                      createdAt: '2026-09-01T08:00:00+00:00'
                      updatedAt: '2026-09-14T16:30:00+00:00'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Tournaments]
      summary: Zmień ustawienia turnieju
      description: |
        Obsługuje też zmianę listy i kolejności tiebreaków (`tiebreakers`) i zmianę
        `slug`. Zmiana `slug` unieważnia dotychczasowy publiczny adres turnieju:
        panel musi o tym ostrzec przed zapisem.

        Zmienia też `status` (znaczenie stanów i to, kto je ustawia:
        `TournamentStatus`). Przejścia między stanami są dowolne i nie mają
        warunków wstępnych. Jedyny zakaz: turniej, który ma mecz rozegrany
        albo trwający (`finished` albo `live`), nie przechodzi do `draft`
        z innego stanu — taka próba daje `422`
        z błędem pod `status`. Wysłanie `draft` turniejowi, który już jest
        w `draft`, nie jest przejściem, więc zakaz go nie dotyczy.

        Punktację (`points`) i tiebreaki (`tiebreakers`) wolno zmieniać zawsze,
        niezależnie od statusu turnieju i od rozegranych meczów. Tabela liczy
        się przy odczycie, więc zmiana obejmuje też mecze już rozegrane.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TournamentUpdate' }
            example:
              name: Liga Osiedlowa 2026/27
              tiebreakers: [points, score_diff, head_to_head, score_for]
      responses:
        '200':
          description: Turniej po zmianie
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Tournament' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Tournaments]
      summary: Usuń turniej
      description: |
        Usuwa turniej na twardo razem z całym poddrzewem: drużynami (także
        usuniętymi wcześniej), zawodnikami, obiektami, fazami i meczami, oraz
        z plikami logo i herbów. Operacji nie da się cofnąć, a `slug` od razu
        się zwalnia.

        Odrzucane z kodem `422`, jeżeli turniej ma choć jeden mecz rozegrany
        albo trwający (`finished` albo `live`): jego publiczny adres ma
        działać dalej. Status turnieju nie ma tu znaczenia.
      responses:
        '204': { description: Usunięto }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/DeleteBlocked' }

  /tournaments/{tournament}/logo:
    parameters:
      - { $ref: '#/components/parameters/TournamentId' }
    post:
      tags: [Tournaments]
      summary: Wgraj logo turnieju
      description: |
        Przyjmuje PNG, JPG albo WebP o rozmiarze do 2 MB i wymiarach od 64×64
        do 4096×4096 pikseli, bez wymogu proporcji. O formacie decyduje treść
        pliku, nie nazwa ani rozszerzenie. Obraz jest zapisywany bez
        przetwarzania.

        Nowy plik zastępuje poprzedni, a poprzedni jest kasowany. Każdy upload
        daje nowy `logoUrl`, więc dotychczasowy adres przestaje działać.
        Naruszenie daje `422` pod `logo`.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [logo]
              properties:
                logo: { type: string, format: binary }
      responses:
        '200':
          description: Turniej z nowym logo
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Tournament' }
              example:
                data:
                  id: 1
                  name: Liga Osiedlowa 2026
                  slug: liga-osiedlowa-2026
                  status: draft
                  sport: { id: 1, code: football, name: Piłka nożna }
                  branding: { logoUrl: http://localhost:8000/storage/tournaments/1/logo/hMbkow7jZDUOi8YzukrkRzF1eY8wqM7DJtNlFrEZ.png, primaryColor: '#1F7A45' }
                  points: { win: 3, draw: 1, loss: 0 }
                  tiebreakers: [points, head_to_head, score_diff, score_for]
                  matchDuration: 60
                  teamsCount: 0
                  createdAt: '2026-09-01T08:00:00+00:00'
                  updatedAt: '2026-09-01T08:00:00+00:00'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Tournaments]
      summary: Usuń logo turnieju
      description: |
        Kasuje plik i ustawia `logoUrl` na `null`. Operacja jest idempotentna:
        bez wgranego logo też daje `200`.
      responses:
        '200':
          description: Turniej bez logo
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Tournament' }
              example:
                data:
                  id: 1
                  name: Liga Osiedlowa 2026
                  slug: liga-osiedlowa-2026
                  status: draft
                  sport: { id: 1, code: football, name: Piłka nożna }
                  branding: { logoUrl: null, primaryColor: '#1F7A45' }
                  points: { win: 3, draw: 1, loss: 0 }
                  tiebreakers: [points, head_to_head, score_diff, score_for]
                  matchDuration: 60
                  teamsCount: 0
                  createdAt: '2026-09-01T08:00:00+00:00'
                  updatedAt: '2026-09-01T08:00:00+00:00'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /tournaments/{tournament}/stages:
    parameters:
      - { $ref: '#/components/parameters/TournamentId' }
    get:
      tags: [Tournaments]
      summary: Fazy turnieju
      description: |
        Turniej ma zawsze co najmniej jedną fazę, także gdy jest zwykłą ligą.
        Endpointy zapisu dla faz wchodzą w v0.2 razem z silnikiem rozgrywek.

        Fazy idą po `order` rosnąco. Drugi klucz nie jest potrzebny, bo `order`
        jest unikalny w obrębie turnieju.
      responses:
        '200':
          description: Fazy wraz z grupami
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Stage' }
              example:
                data:
                  - id: 1
                    type: league
                    name: Faza zasadnicza
                    order: 1
                    groups: []
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /stages/{stage}/schedule:
    parameters:
      - { $ref: '#/components/parameters/StageId' }
    post:
      tags: [Schedule]
      summary: Wygeneruj terminarz fazy
      description: |
        Układa fazę `league` w kolejki „każdy z każdym” według tablic Bergera
        i zastępuje cały dotychczasowy terminarz fazy, także terminy i obiekty
        poprawione ręcznie. Wszystko dzieje się w jednej transakcji.

        - Grają wszystkie drużyny turnieju. Ich kolejność na wejściu jest
          losowana przy każdym wywołaniu, więc kolejne generowanie daje inne
          pary w kolejkach.
        - `meetings: 2` dokłada rewanż jako czyste lustro: kolejka
          `n − 1 + t` (`n` przy nieparzystej liczbie drużyn) to kolejka `t`
          z odwróconym gospodarzem.
        - Przy nieparzystej liczbie drużyn jedna drużyna pauzuje w każdej
          kolejce. Pauza nie tworzy meczu.
        - Kolejki nazywają się „Kolejka 1”, „Kolejka 2”… z numeracją ciągłą
          przez obie rundy. Mecze są `scheduled`, bez `kickoffAt` i bez
          obiektu.

        Status turnieju nie ma znaczenia. Odmowy to `422`: pod `stage`, gdy
        faza nie jest `league` albo ma mecz `live` lub `finished`, i pod
        `teams`, gdy turniej ma mniej niż dwie drużyny. Mecze dociąga się potem
        przez `GET /tournaments/{tournament}/matches?stageId=`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [meetings]
              properties:
                meetings:
                  type: integer
                  enum: [1, 2]
                  description: |
                    Ile razy w fazie spotyka się każda para: `1` to jedna
                    runda, `2` to mecz i rewanż. Bez wartości domyślnej.
            example:
              meetings: 2
      responses:
        '201':
          description: Terminarz wygenerowany
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [roundsCount, matchesCount]
                    properties:
                      roundsCount: { type: integer, minimum: 1 }
                      matchesCount: { type: integer, minimum: 1 }
              example:
                data: { roundsCount: 38, matchesCount: 380 }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: Fazy nie da się wygenerować albo ciało jest niepoprawne
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }
              examples:
                zaMaloDruzyn:
                  summary: Mniej niż dwie drużyny
                  value:
                    message: Liga potrzebuje co najmniej dwóch drużyn.
                    errors:
                      teams: [Liga potrzebuje co najmniej dwóch drużyn.]
                rozegraneMecze:
                  summary: Faza ma mecz trwający albo zakończony
                  value:
                    message: Faza ma rozegrane mecze, więc nie można wygenerować terminarza ponownie.
                    errors:
                      stage: [Faza ma rozegrane mecze, więc nie można wygenerować terminarza ponownie.]
                fazaNieLigowa:
                  summary: Faza inna niż `league`
                  value:
                    message: Generowanie terminarza działa na razie tylko dla fazy ligowej.
                    errors:
                      stage: [Generowanie terminarza działa na razie tylko dla fazy ligowej.]

  /stages/{stage}/schedule/dates:
    parameters:
      - { $ref: '#/components/parameters/StageId' }
    post:
      tags: [Schedule]
      summary: Rozłóż daty i obiekty terminarza
      description: |
        Nadaje terminy i obiekty meczom fazy, która ma już terminarz
        (`POST /stages/{stage}/schedule`). To osobny krok po wygenerowaniu par,
        więc przestawienie dat nie losuje ich od nowa. Faza może trwale zostać
        bez dat, a pojedynczy mecz bez terminu i obiektu („termin do
        ustalenia”).

        - `mode: interval` — liga sezonowa: kolejka `k` (licząc od pierwszej
          rozkładanej) zaczyna się `startAt + (k − 1) × intervalDays` dni,
          licząc w `timeZone`. Dzięki temu ta sama godzina zegarowa obowiązuje
          także przez zmianę czasu.
        - `mode: continuous` — turniej jedno-, dwudniowy: mecz za meczem,
          kolejka `k + 1` zaczyna się w pierwszym slocie po ostatnim meczu
          kolejki `k`, nigdy wcześniej.
        - Mecz `j` w kolejce (licząc od zera) dostaje obiekt
          `venueIds[j mod V]` i godzinę startu kolejki plus
          `⌊j / V⌋ × matchDuration`. Bez obiektów cała kolejka gra o jednej
          godzinie i bez obiektu.
        - `dayEndTime` (tylko `continuous`): slot, który **kończyłby się** po tej
          godzinie, przechodzi na następny dzień kalendarzowy o godzinie
          `startAt`. Kolejka może przez to rozciągnąć się na dwa dni. Wyjątkiem
          jest slot dłuższy niż okno dnia (od `startAt` do `dayEndTime`): taki
          slot zostaje, bo nie da się go zmieścić nigdzie.
        - `fromRound` — `order` kolejki, od której rozkład idzie od nowa
          (domyślnie od pierwszej). Zastępuje osobną operację „przesuń kolejkę”.
        - Rusza wyłącznie mecze `scheduled` w kolejkach od `fromRound`
          i nadpisuje ręczne korekty. Mecze `live` i `finished` oraz kolejki
          przed `fromRound` zachowują termin i obiekt.

        Rozkład wolno powtarzać zawsze. Status turnieju nie gra roli. Odmowa to
        `422` pod `stage`, gdy faza nie ma jeszcze terminarza. Odpowiedź niesie
        liczbę meczów, które dostały termin, i liczbę meczów fazy, które po
        rozkładzie mają kolizję.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode, startAt, timeZone]
              properties:
                mode:
                  type: string
                  enum: [interval, continuous]
                startAt:
                  type: string
                  format: date-time
                  description: |
                    Początek pierwszej rozkładanej kolejki. **Wymagany offset**
                    (np. `+02:00` albo `Z`): data bez offsetu daje `422`, bo nie
                    wiadomo, który moment organizer miał na myśli (ADR-0008).
                    Backend przelicza wartość na UTC i przyjmuje ten sam moment,
                    więc `2026-09-06T10:00:00+02:00` to `08:00:00+00:00`.
                timeZone:
                  type: string
                  description: |
                    Strefa IANA (np. `Europe/Warsaw`), w której liczona jest
                    arytmetyka „+7 dni o tej samej godzinie” i „następny dzień
                    o godzinie startu”. Panel bierze ją z przeglądarki.
                intervalDays:
                  type: [integer, 'null']
                  minimum: 1
                  description: |
                    Odstęp między kolejkami w dniach. Wymagane przy
                    `mode: interval`; przy `mode: continuous` musi być nieobecne.
                dayEndTime:
                  type: [string, 'null']
                  pattern: '^([01]\d|2[0-3]):[0-5]\d$'
                  description: |
                    Najpóźniejsza godzina dnia (w `timeZone`, `HH:MM`), o której
                    mecz może się skończyć. Dozwolone tylko przy
                    `mode: continuous`.
                venueIds:
                  type: array
                  maxItems: 20
                  uniqueItems: true
                  description: |
                    Obiekty turnieju, na które rozkładane są sloty, w kolejności
                    użycia. Bez powtórzeń. Obiekt innego turnieju albo usunięty
                    daje `422`. Brak pola albo pusta lista znaczy „bez obiektów”:
                    wtedy cała kolejka gra o jednej godzinie i bez obiektu.
                  items: { type: integer, format: int64 }
                fromRound:
                  type: [integer, 'null']
                  minimum: 1
                  description: |
                    `order` kolejki, od której rozkład idzie od nowa. Bez pola
                    rozkład obejmuje wszystkie kolejki.
            example:
              mode: interval
              startAt: '2026-09-06T10:00:00+02:00'
              timeZone: Europe/Warsaw
              intervalDays: 7
              dayEndTime: null
              venueIds: [1, 2]
              fromRound: null
      responses:
        '200':
          description: Daty rozłożone
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [matchesCount, collisionsCount]
                    properties:
                      matchesCount:
                        type: integer
                        minimum: 0
                        description: |
                          Ile meczów `scheduled` dostało termin i obiekt. Bez
                          wybranych obiektów mecz dostaje sam termin, a obiekt
                          zostaje pusty.
                      collisionsCount:
                        type: integer
                        minimum: 0
                        description: |
                          Ile meczów fazy po rozkładzie ma kolizję, licząc także
                          kolizje z meczami innych faz tego samego turnieju.
              example:
                data: { matchesCount: 190, collisionsCount: 2 }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: Faza nie ma terminarza albo ciało jest niepoprawne
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }
              examples:
                bezTerminarza:
                  summary: Faza nie ma jeszcze terminarza
                  value:
                    message: Faza nie ma jeszcze terminarza, więc nie ma czego rozkładać.
                    errors:
                      stage: [Faza nie ma jeszcze terminarza, więc nie ma czego rozkładać.]

  /tournaments/{tournament}/teams:
    parameters:
      - { $ref: '#/components/parameters/TournamentId' }
    get:
      tags: [Teams]
      summary: Drużyny w turnieju
      description: |
        Po `name` rosnąco, a drużyny o tej samej nazwie rozstrzyga `id`, też rosnąco.
      responses:
        '200':
          description: Pełna lista drużyn, bez stronicowania
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Team' }
              example:
                data:
                  - { id: 3, tournamentId: 1, name: Orły Bielany, logoUrl: null, groupId: null, playersCount: 3, scheduledMatchesCount: 2 }
                  - { id: 2, tournamentId: 1, name: Sokoły Ursus, logoUrl: null, groupId: null, playersCount: 3, scheduledMatchesCount: 2 }
                  - { id: 1, tournamentId: 1, name: Wilki Bemowo, logoUrl: null, groupId: null, playersCount: 3, scheduledMatchesCount: 2 }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Teams]
      summary: Dodaj drużynę
      description: |
        Nazwa jest unikalna wśród drużyn turnieju, bez względu na wielkość
        liter. Spacje na brzegach nazwy są obcinane, a drużyna usunięta nie
        blokuje nazwy. Konflikt nazw daje `422` z błędem pod `name`.

        Turniej mieści najwyżej 128 drużyn. Próba dodania kolejnej daje `422`
        z błędem pod `teams`.

        Turniej z meczem rozegranym albo trwającym (`finished` albo `live`)
        nie przyjmuje nowych drużyn: próba daje `422` z błędem pod `teams`.
        Wcześniej dodawanie jest dozwolone, ale istniejący terminarz nowej
        drużyny nie obejmuje — obejmie ją dopiero ponowne wygenerowanie.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 120 }
            example:
              name: Wilki Bemowo
      responses:
        '201':
          description: Drużyna dodana
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Team' }
              example:
                data: { id: 1, tournamentId: 1, name: Wilki Bemowo, logoUrl: null, groupId: null, playersCount: 0, scheduledMatchesCount: 0 }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /teams/{team}:
    parameters:
      - { $ref: '#/components/parameters/TeamId' }
    get:
      tags: [Teams]
      summary: Szczegóły drużyny
      responses:
        '200':
          description: Drużyna
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Team' }
              example:
                data: { id: 1, tournamentId: 1, name: Wilki Bemowo, logoUrl: null, groupId: null, playersCount: 3, scheduledMatchesCount: 2 }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Teams]
      summary: Zmień drużynę
      description: |
        Nazwa podlega tym samym zasadom co przy `POST
        /tournaments/{tournament}/teams`, a konflikt nazw daje `422` z błędem
        pod `name`.

        Przypisania do grupy nie da się w v0.1 zmienić: grupy są poza zakresem
        tej wersji, więc `Team.groupId` jest wyłącznie do odczytu i zawsze `null`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 1, maxLength: 120 }
      responses:
        '200':
          description: Drużyna po zmianie
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Team' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Teams]
      summary: Usuń drużynę
      description: |
        Usuwa także zawodników drużyny i wszystkie jej mecze `scheduled`
        (`Team.scheduledMatchesCount`). Reszta terminarza się nie zmienia:
        kolejki zostają, także te, które opustoszały, a pozostałe mecze
        zachowują termin, obiekt, kolejkę i `matchNumber`. Numery meczów nie
        są przenumerowywane, więc w kolejce mogą powstać dziury.

        Daje `422` z błędem pod `id`, jeżeli drużyna ma mecz rozegrany albo
        trwający (`finished` albo `live`): usunięcie zmieniłoby tabelę wstecz.
        Odmowa niczego nie zmienia — drużyna, jej zawodnicy i mecze zostają.
      responses:
        '204': { description: Usunięto }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/DeleteBlocked' }

  /teams/{team}/logo:
    parameters:
      - { $ref: '#/components/parameters/TeamId' }
    post:
      tags: [Teams]
      summary: Wgraj herb drużyny
      description: |
        Przyjmuje PNG, JPG albo WebP o rozmiarze do 2 MB i wymiarach od 64×64
        do 4096×4096 pikseli, bez wymogu proporcji. O formacie decyduje treść
        pliku, nie nazwa ani rozszerzenie. Obraz jest zapisywany bez
        przetwarzania.

        Nowy plik zastępuje poprzedni, a poprzedni jest kasowany. Każdy upload
        daje nowy `logoUrl`, więc dotychczasowy adres przestaje działać.
        Naruszenie daje `422` pod `logo`.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [logo]
              properties:
                logo: { type: string, format: binary }
      responses:
        '200':
          description: Drużyna z nowym herbem
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Team' }
              example:
                data: { id: 1, tournamentId: 1, name: Wilki Bemowo, logoUrl: http://localhost:8000/storage/tournaments/1/teams/1/GmvZcUftUF1rp7d6ntSTGxnDGWHVCmrmYYNbs9IG.png, groupId: null, playersCount: 3, scheduledMatchesCount: 2 }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Teams]
      summary: Usuń herb drużyny
      description: |
        Kasuje plik i ustawia `logoUrl` na `null`. Operacja jest idempotentna:
        bez wgranego logo też daje `200`.
      responses:
        '200':
          description: Drużyna bez herbu
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Team' }
              example:
                data: { id: 1, tournamentId: 1, name: Wilki Bemowo, logoUrl: null, groupId: null, playersCount: 3, scheduledMatchesCount: 2 }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /teams/{team}/players:
    parameters:
      - { $ref: '#/components/parameters/TeamId' }
    get:
      tags: [Players]
      summary: Zawodnicy drużyny
      description: |
        Po `number` rosnąco, a zawodnicy bez numeru na końcu. Przy tym samym
        numerze (albo jego braku) decyduje `name`, a potem `id`, oba rosnąco.
      responses:
        '200':
          description: Pełna lista zawodników, bez stronicowania
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Player' }
              example:
                data:
                  - { id: 2, teamId: 1, name: Piotr Kowal, number: 1, position: bramkarz }
                  - { id: 3, teamId: 1, name: Jakub Wrona, number: 7, position: pomocnik }
                  - { id: 1, teamId: 1, name: Marek Nowak, number: 9, position: napastnik }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Players]
      summary: Dodaj zawodnika
      description: |
        `number` jest unikalny wśród tych zawodników drużyny, którzy mają
        numer; `null` z niczym nie koliduje, a zawodnik usunięty nie blokuje
        numeru. Konflikt numerów daje `422` z błędem pod `number`. Imię
        i nazwisko mogą się w drużynie powtarzać. `position` to wolny tekst.

        Drużyna mieści najwyżej 50 zawodników. Próba dodania kolejnego daje
        `422` z błędem pod `players`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 120 }
                number: { type: [integer, 'null'], minimum: 0, maximum: 999 }
                position: { type: [string, 'null'], maxLength: 60 }
            example:
              name: Marek Nowak
              number: 9
              position: napastnik
      responses:
        '201':
          description: Zawodnik dodany
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Player' }
              example:
                data: { id: 1, teamId: 1, name: Marek Nowak, number: 9, position: napastnik }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /players/{player}:
    parameters:
      - { $ref: '#/components/parameters/PlayerId' }
    patch:
      tags: [Players]
      summary: Zmień zawodnika
      description: |
        `number`, `name` i `position` podlegają tym samym zasadom co przy
        `POST /teams/{team}/players`, a konflikt numerów daje `422` z błędem
        pod `number`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 1, maxLength: 120 }
                number: { type: [integer, 'null'], minimum: 0, maximum: 999 }
                position: { type: [string, 'null'], maxLength: 60 }
      responses:
        '200':
          description: Zawodnik po zmianie
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Player' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Players]
      summary: Usuń zawodnika
      description: |
        Daje `422` z błędem pod `id`, jeżeli zawodnik ma zdarzenie w meczu
        rozegranym albo trwającym (`finished` albo `live`): usunięcie
        zmieniłoby klasyfikację strzelców wstecz. Odmowa niczego nie zmienia.
      responses:
        '204': { description: Usunięto }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/DeleteBlocked' }

  /tournaments/{tournament}/venues:
    parameters:
      - { $ref: '#/components/parameters/TournamentId' }
    get:
      tags: [Venues]
      summary: Obiekty w turnieju
      description: |
        Po `name` rosnąco, a obiekty o tej samej nazwie rozstrzyga `id`, też rosnąco.
      responses:
        '200':
          description: Pełna lista obiektów, bez stronicowania
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Venue' }
              example:
                data:
                  - { id: 1, tournamentId: 1, name: Boisko Bemowo, address: 'ul. Powstańców Śląskich 1, Warszawa', scheduledMatchesCount: 2 }
                  - { id: 2, tournamentId: 1, name: Hala Ursus, address: 'ul. Sosnkowskiego 3, Warszawa', scheduledMatchesCount: 0 }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Venues]
      summary: Dodaj obiekt
      description: |
        Nazwa jest unikalna wśród obiektów turnieju, bez względu na wielkość
        liter. Spacje na brzegach nazwy są obcinane, a obiekt usunięty nie
        blokuje nazwy. Konflikt nazw daje `422` z błędem pod `name`.

        Turniej mieści najwyżej 32 obiekty. Próba dodania kolejnego daje `422`
        z błędem pod `venues`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 120 }
                address: { type: [string, 'null'], maxLength: 255 }
            example:
              name: Boisko Bemowo
              address: 'ul. Powstańców Śląskich 1, Warszawa'
      responses:
        '201':
          description: Obiekt dodany
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Venue' }
              example:
                data: { id: 1, tournamentId: 1, name: Boisko Bemowo, address: 'ul. Powstańców Śląskich 1, Warszawa', scheduledMatchesCount: 0 }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /venues/{venue}:
    parameters:
      - { $ref: '#/components/parameters/VenueId' }
    patch:
      tags: [Venues]
      summary: Zmień obiekt
      description: |
        Nazwa podlega tym samym zasadom co przy `POST
        /tournaments/{tournament}/venues`, a konflikt nazw daje `422` z błędem
        pod `name`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 1, maxLength: 120 }
                address: { type: [string, 'null'], maxLength: 255 }
      responses:
        '200':
          description: Obiekt po zmianie
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Venue' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Venues]
      summary: Usuń obiekt
      description: |
        Mecze `scheduled` na tym obiekcie (`Venue.scheduledMatchesCount`)
        zostają w terminarzu bez obiektu (`Match.venue: null`), z tym samym
        terminem, drużynami i kolejką.

        Daje `422` z błędem pod `id`, jeżeli na obiekcie jest mecz rozegrany
        albo trwający (`finished` albo `live`). Odmowa niczego nie zmienia.
      responses:
        '204': { description: Usunięto }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/DeleteBlocked' }

  /tournaments/{tournament}/matches:
    parameters:
      - { $ref: '#/components/parameters/TournamentId' }
      - { name: stageId, in: query, schema: { type: integer, format: int64 } }
      - { name: roundId, in: query, schema: { type: integer, format: int64 } }
      - name: status
        in: query
        schema: { $ref: '#/components/schemas/MatchStatus' }
      - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
      - { name: perPage, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
    get:
      tags: [Reads]
      summary: Mecze turnieju
      description: |
        Odczyt. Wpisywanie wyniku i zmiana stanu meczu wchodzą w v0.2, ale kształt
        `Match` jest już zamrożony.

        Kolejność: faza (`order`), w niej kolejka (`round.order`), w kolejce
        `matchNumber`, wszystko rosnąco. `matchNumber` może mieć dziury (po
        usunięciu drużyny razem z jej meczami `scheduled`), więc pozycji meczu
        nie wyliczaj z numeru. Faza albo kolejka spoza turnieju w `stageId`
        i `roundId` daje puste `data`, nie `404`: `404` jest tu odpowiedzią
        o turnieju. `perPage` ponad limit jest dociągane do 200, a nieczytelne
        daje rozmiar domyślny. Filtr o złym typie albo nieznanym `status` daje
        `422`, bo cicha lista bez filtra wyglądałaby jak filtr działający.

        Stronicowane: liga dwudziestu drużyn to sto dziewięćdziesiąt meczów,
        każdy z zagnieżdżonymi drużynami. Widok drabinki potrzebuje kompletu
        meczów fazy, żeby zbudować odwrotny indeks krawędzi — zawęża więc
        odpowiedź przez `stageId`, bo faza pucharowa nawet przy szesnastu
        drużynach mieści się w jednej stronie.

        Przykłady są trzy: `liga` (domyślny), `puchar` i `koszykowka`. Mock
        zwraca drugi po wysłaniu nagłówka `Prefer: example=puchar`, a trzeci po
        `Prefer: example=koszykowka`. Koszykarski jest zgodny z przykładem
        `koszykowka` tabeli i turnieju, więc jeden przełącznik przestawia
        w panelu turniej, terminarz i tabelę naraz.
      responses:
        '200':
          description: Stronicowane mecze, opcjonalnie zawężone parametrami
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/AdminMatch' }
                  meta: { $ref: '#/components/schemas/PaginationMeta' }

                  summary: Faza pucharowa — drabinka sześciodrużynowa w trakcie
                  description: |
                    Odpowiedź zawężona przez `stageId=2`, czyli tyle, ile widok
                    drabinki potrzebuje do zbudowania odwrotnego indeksu
                    krawędzi. Kształt daje `POST /stages/{stage}/bracket` dla

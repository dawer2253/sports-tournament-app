  /matches/{match}:
    parameters:
      - { $ref: '#/components/parameters/MatchId' }
    patch:
      tags: [Matches]
      summary: Wpisz wynik, zmień stan, termin albo obiekt meczu
      description: |
        Częściowa zmiana meczu: wynik i stan (reguły z #159), a także korekta
        terminu i obiektu (#158). Pole nieobecne zostaje bez zmian. Reguły
        spójności, klucz `homeScore` oraz to, że termin i obiekt wolno zmieniać
        przy każdym stanie, opisuje `MatchUpdate`.

        Odpowiedź to ten sam `AdminMatch`, co na liście meczów, więc okno meczu
        dostaje po zapisie świeże kolizje bez osobnego odczytu.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MatchUpdate' }
            examples:
              wynik:
                summary: Mecz zakończony z wynikiem
                value: { status: finished, homeScore: 3, awayScore: 1 }
              terminIObiekt:
                summary: Korekta terminu i obiektu bez zmiany wyniku
                value: { kickoffAt: '2026-10-11T10:00:00+02:00', venueId: 2 }
      responses:
        '200':
          description: Mecz po zmianie
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/AdminMatch' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: Wynik niespójny ze stanem, obcy obiekt albo niepoprawne ciało
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }
              examples:
                scheduledZWynikiem:
                  summary: Powrót do `scheduled` bez jawnego wyczyszczenia wyniku
                  value:
                    message: 'Mecz zaplanowany nie ma wyniku. Wyczyść oba pola: homeScore i awayScore.'
                    errors:
                      homeScore: ['Mecz zaplanowany nie ma wyniku. Wyczyść oba pola: homeScore i awayScore.']
                remisBezRemisow:
                  summary: 'Remis przy allowsDraw: false na meczu finished'
                  value:
                    message: 'Ten sport nie zna remisu, więc mecz zakończony musi mieć zwycięzcę.'
                    errors:
                      homeScore: ['Ten sport nie zna remisu, więc mecz zakończony musi mieć zwycięzcę.']

  /tournaments/{tournament}/standings:
    parameters:
      - { $ref: '#/components/parameters/TournamentId' }
    get:
      tags: [Reads]
      summary: Tabele turnieju
      description: |
        Tabela nie jest bytem zapisywanym: jest liczona przy każdym odczycie
        z zakończonych meczów. Mecz trwający (`live`) się nie liczy. Jedna
        pozycja na fazę `league` i jedna na każdą grupę w fazie `group`. Faza
        `knockout` nie ma tabeli.

        Tabela zawiera komplet drużyn fazy, także tych, które nie rozegrały
        jeszcze meczu: dostają wiersz z zerami. Przed pierwszym meczem i w fazie
        bez terminarza są to wszystkie drużyny fazy alfabetycznie, a nie pusta
        lista. Drużyny usunięte nie mają wiersza.

        Kolejność ustala lista `Tournament.tiebreakers` (znaczenie kryteriów:
        `TiebreakerCode`), a po niej ukryte ostatnie kryterium: nazwa drużyny,
        alfabetycznie po polsku, bez rozróżniania wielkości liter.

        Przykłady są dwa, po jednym na sport, te same co w
        `/public/t/{slug}/standings`: `pilka` (domyślny, zgodny z seedem demo)
        i `koszykowka`. Mock zwraca drugi po wysłaniu nagłówka
        `Prefer: example=koszykowka`. Drugi przykład jest tu po to, żeby dało
        się sprawdzić, czy panel bierze nagłówek kolumny z odpowiedzi, a nie ze
        sztywnego napisu. `GET /tournaments/{tournament}` i lista meczów panelu
        mają ten sam przełącznik, więc w panelu przestawia naraz turniej,
        terminarz i tabelę. Mock nie liczy tabel, więc parametr `tiebreakers`
        niczego w nim nie zmienia.
      parameters:
        - name: tiebreakers
          in: query
          description: |
            Podgląd: liczy tabele według podanej listy kryteriów zamiast
            zapisanej w turnieju i **niczego nie zapisuje**. Panel pokazuje
            dzięki temu skutek nowej kolejności przed zapisem. Bez parametru
            odpowiedź liczy się według `Tournament.tiebreakers`.

            Lista podlega tym samym regułom co `tiebreakers` w
            `PATCH /tournaments/{tournament}` (`TournamentUpdate`) i daje te
            same błędy `422` pod tymi samymi kluczami: `tiebreakers.N` przy
            elemencie, `tiebreakers.0` przy braku `points` na początku,
            `tiebreakers` przy pustej wartości. Powtórzony klucz i notacja
            nawiasowa (`tiebreakers[]=`) dają `422` pod `tiebreakers` (ADR-0009).
          required: false
          style: form
          explode: false
          schema:
            type: array
            minItems: 1
            uniqueItems: true
            items: { $ref: '#/components/schemas/TiebreakerCode' }
          example: [points, score_diff, head_to_head]
      responses:

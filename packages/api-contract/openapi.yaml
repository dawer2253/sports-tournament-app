                    - { position: 2, player: { id: 5, name: Adam Zieliński }, team: { id: 2, name: Sokoły Ursus, logoUrl: null }, value: 2 }
                    - { position: 3, player: { id: 3, name: Jakub Wrona }, team: { id: 1, name: Wilki Bemowo, logoUrl: null }, value: 1 }
                    - { position: 3, player: { id: 4, name: Tomasz Lis }, team: { id: 2, name: Sokoły Ursus, logoUrl: null }, value: 1 }
                    - { position: 3, player: { id: 7, name: Rafał Duda }, team: { id: 3, name: Orły Bielany, logoUrl: null }, value: 1 }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Token wydany przez `/login` lub `/register`, bez daty wygaśnięcia.

  parameters:
    TournamentId:
      name: tournament
      in: path
      required: true
      schema: { type: integer, format: int64 }
    TeamId:
      name: team
      in: path
      required: true
      schema: { type: integer, format: int64 }
    PlayerId:
      name: player
      in: path
      required: true
      schema: { type: integer, format: int64 }
    VenueId:
      name: venue
      in: path
      required: true
      schema: { type: integer, format: int64 }
    Slug:
      name: slug
      in: path
      required: true
      schema: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$' }

  responses:
    Unauthenticated:
      description: Brak lub nieważny token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { message: Unauthenticated. }
    Forbidden:
      description: Zasób należy do innego organizera
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { message: This action is unauthorized. }
    NotFound:
      description: Zasób nie istnieje
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { message: Nie znaleziono zasobu. }
    ValidationError:
      description: Dane nie przeszły walidacji
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ValidationError' }
          example:
            message: Podane dane są nieprawidłowe.
            errors:
              name: [Pole nazwa jest wymagane.]

  schemas:
    Error:
      type: object
      required: [message]
      properties:
        message: { type: string }

    ValidationError:
      type: object
      required: [message, errors]
      properties:
        message: { type: string }
        errors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }

    PaginationMeta:
      type: object
      required: [currentPage, lastPage, perPage, total]
      properties:
        currentPage: { type: integer, minimum: 1 }
        lastPage: { type: integer, minimum: 1 }
        perPage: { type: integer, minimum: 1 }
        total: { type: integer, minimum: 0 }

    User:
      type: object
      required: [id, name, email, createdAt]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        email: { type: string, format: email }
        createdAt: { type: string, format: date-time }

    AuthPayload:
      type: object
      required: [token, user]
      properties:
        token: { type: string }
        user: { $ref: '#/components/schemas/User' }

    SportCode:
      type: string
      enum: [football, basketball]

    Points:
      type: object
      required: [win, draw, loss]
      properties:
        win: { type: integer }
        draw:
          type: integer
          description: |
            Punkty za remis. W sporcie z `allowsDraw: false` remis nie może
            wystąpić, więc wartość jest bez znaczenia i backend zwraca zero.
        loss: { type: integer }

    SportEventType:
      type: object
      required: [code, label, hasPlayer, stat]
      properties:
        code: { type: string }
        label: { type: string }
        hasPlayer:
          type: boolean
          description: Czy zdarzenie wymaga wskazania zawodnika.
        stat:
          type: [string, 'null']
          description: Kod statystyki, do której zdarzenie się wlicza. `null` oznacza zdarzenie bez wpływu na statystyki.

    SportConfig:
      type: object
      required: [allowsDraw, defaultPoints, eventTypes, defaultTiebreakers, availableTiebreakers, availableStats]
      properties:
        allowsDraw:
          type: boolean
          description: Czy w tym sporcie mecz może zakończyć się remisem.
        defaultPoints: { $ref: '#/components/schemas/Points' }
        eventTypes:
          type: array
          items: { $ref: '#/components/schemas/SportEventType' }
        defaultTiebreakers:
          type: array
          description: |
            Kolejność tiebreaków, którą turniej dostaje przy zakładaniu.
            Podzbiór `availableTiebreakers`; organizer zmienia ją potem
            u siebie przez `PATCH /tournaments/{tournament}`.
          items: { $ref: '#/components/schemas/TiebreakerCode' }
        availableTiebreakers:
          type: array
          items: { $ref: '#/components/schemas/TiebreakerCode' }
        availableStats:
          type: array
          items: { type: string }

    Sport:
      type: object
      required: [id, code, name, config]
      properties:
        id: { type: integer, format: int64 }
        code: { $ref: '#/components/schemas/SportCode' }
        name: { type: string }
        config: { $ref: '#/components/schemas/SportConfig' }

    SportSummary:
      type: object
      required: [id, code, name]
      properties:
        id: { type: integer, format: int64 }
        code: { $ref: '#/components/schemas/SportCode' }
        name: { type: string }

    TiebreakerCode:
      type: string
      description: |
        Kryterium rozstrzygające o kolejności w tabeli. `points` jest zawsze
        pierwsze na liście turnieju. `head_to_head` porównuje wyłącznie mecze
        między remisującymi drużynami i nie zagłębia się rekurencyjnie: gdy nie
        rozstrzyga, stosowane jest następne kryterium z listy.
      enum: [points, head_to_head, score_diff, score_for, score_against, wins]

    TournamentStatus:
      type: string
      enum: [draft, active, finished]

    TournamentFormat:
      type: string
      description: |
        Używane wyłącznie przy zakładaniu turnieju, żeby wiedzieć jakie fazy
        utworzyć. Nie jest polem turnieju: strukturę opisują fazy.
      enum: [league, groups_playoff, knockout]

    Branding:
      type: object
      required: [logoUrl, primaryColor]
      properties:
        logoUrl: { type: [string, 'null'], format: uri }
        primaryColor:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'

    Tournament:
      type: object
      required: [id, name, slug, status, sport, branding, points, tiebreakers, teamsCount, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        slug: { type: string }
        status: { $ref: '#/components/schemas/TournamentStatus' }
        sport: { $ref: '#/components/schemas/SportSummary' }
        branding: { $ref: '#/components/schemas/Branding' }
        points:
          allOf:
            - $ref: '#/components/schemas/Points'
          description: Punktacja obowiązująca w tym turnieju, wyjściowo skopiowana z domyślnej dla sportu.
        tiebreakers:
          type: array
          items: { $ref: '#/components/schemas/TiebreakerCode' }
          description: Uporządkowana lista kryteriów, stosowanych po kolei.
        teamsCount: { type: integer, minimum: 0 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    TournamentCreate:
      type: object
      required: [name, sportId, format]
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
        sportId: { type: integer, format: int64 }
        format: { $ref: '#/components/schemas/TournamentFormat' }

    TournamentUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
        slug: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$', minLength: 3, maxLength: 80 }
        status: { $ref: '#/components/schemas/TournamentStatus' }
        branding:
          type: object
          additionalProperties: false
          description: |
            Branding jest zagnieżdżony tak samo jak w odczycie
            (`Tournament.branding`), żeby formularz panelu nie musiał go
            spłaszczać i rozwijać z powrotem. Zapisywalne jest tu wyłącznie
            `primaryColor`: logo wgrywa się przez
            `POST /tournaments/{tournament}/logo`, więc `logoUrl` w tym kształcie
            nie występuje.
          properties:
            primaryColor: { type: string, pattern: '^#[0-9A-Fa-f]{6}$' }
        points: { $ref: '#/components/schemas/Points' }
        tiebreakers:
          type: array
          items: { $ref: '#/components/schemas/TiebreakerCode' }

    StageType:
      type: string
      description: |
        `league` to jedna tabela, `group` to kilka niezależnych tabel,
        `knockout` to drabinka. Turniej ma zawsze co najmniej jedną fazę.
      enum: [league, group, knockout]

    Group:
      type: object
      required: [id, name]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }

    Stage:
      type: object
      required: [id, type, name, order, groups]
      properties:
        id: { type: integer, format: int64 }
        type: { $ref: '#/components/schemas/StageType' }
        name: { type: string }
        order: { type: integer, minimum: 1 }
        groups:
          type: array
          description: Niepuste wyłącznie dla fazy `group`.
          items: { $ref: '#/components/schemas/Group' }

    RoundSummary:
      type: object
      description: |
        Uporządkowany zbiór meczów rozgrywanych razem. W fazie `league` i `group`
        nazywany w interfejsie kolejką, w fazie `knockout` rundą. W API to jeden byt.
      required: [id, name, order]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        order: { type: integer, minimum: 1 }

    Team:
      type: object
      required: [id, tournamentId, name, logoUrl, groupId]
      properties:
        id: { type: integer, format: int64 }
        tournamentId: { type: integer, format: int64 }
        name: { type: string }
        logoUrl: { type: [string, 'null'], format: uri }
        groupId:
          type: [integer, 'null']
          format: int64
          description: Grupa w fazie `group`. `null`, gdy turniej nie ma fazy grupowej.

    TeamSummary:
      type: object
      required: [id, name, logoUrl]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        logoUrl: { type: [string, 'null'], format: uri }

    Player:
      type: object
      required: [id, teamId, name, number, position]
      properties:
        id: { type: integer, format: int64 }
        teamId: { type: integer, format: int64 }
        name: { type: string }
        number: { type: [integer, 'null'] }
        position: { type: [string, 'null'] }

    PlayerSummary:
      type: object
      required: [id, name]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }

    Venue:
      type: object
      required: [id, tournamentId, name, address]
      properties:
        id: { type: integer, format: int64 }
        tournamentId: { type: integer, format: int64 }
        name: { type: string }
        address: { type: [string, 'null'] }

    VenueSummary:
      type: object
      required: [id, name]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }

    MatchStatus:
      type: string
      description: Tylko mecz `finished` wpływa na tabelę i statystyki.
      enum: [scheduled, live, finished]

    Match:
      type: object
      description: |
        Kształt zamrożony w v0.1. Pola drabinkowe (`winnerToMatchId`,
        `loserToMatchId`, `advancesToSlot`) opisuje
        [ADR-0004](../../docs/adr/0004-drabinka-pozycja-wlasna-i-propagacja-osobno.md).
      required: [id, stageId, groupId, round, matchNumber, homeTeam, awayTeam, homeScore, awayScore, homePenalties, awayPenalties, status, kickoffAt, venue, winnerToMatchId, loserToMatchId, advancesToSlot]
      properties:
        id: { type: integer, format: int64 }
        stageId: { type: integer, format: int64 }
        groupId:
          type: [integer, 'null']
          format: int64
          description: Grupa, w ramach której mecz się liczy. `null` poza fazą `group`. Nie istnieje mecz międzygrupowy.
        round: { $ref: '#/components/schemas/RoundSummary' }
        matchNumber:
          type: integer
          minimum: 1
          description: |
            Numer meczu w obrębie rundy, liczony od jedynki. W drabince razem
            z `round.order` tworzy pozycję własną meczu, z której widok wylicza
            etykietę ("1/2 finału", "Finał") — etykiety nie ma w danych, bo
            zależy od rozmiaru drabinki. W lidze daje stabilną kolejność meczów
            w kolejce.
        homeTeam:
          oneOf:
            - $ref: '#/components/schemas/TeamSummary'
            - type: 'null'
          description: |
            `null`, gdy miejsce w drabince nie jest jeszcze rozstrzygnięte.

            Pauza (bye) **nie** tworzy meczu. W lidze nieparzystej kolejka ma po
            prostu o jeden mecz mniej. W drabince pauza objawia się tym, że slot
            poza pierwszą rundą jest obsadzony drużyną, a nie prowadzi do niego
            żadna krawędź: żaden mecz nie wskazuje go przez `winnerToMatchId`
            ani `loserToMatchId`. Osobnego pola na pauzę nie ma — tak przewiduje
            [ADR-0004](../../docs/adr/0004-drabinka-pozycja-wlasna-i-propagacja-osobno.md).
        awayTeam:
          oneOf:
            - $ref: '#/components/schemas/TeamSummary'
            - type: 'null'
        homeScore: { type: [integer, 'null'], minimum: 0 }
        awayScore: { type: [integer, 'null'], minimum: 0 }
        homePenalties:
          type: [integer, 'null']
          minimum: 0
          description: |
            Rzuty karne gospodarza. Niepuste wyłącznie wtedy, gdy mecz jest
            w fazie `knockout`, jest zakończony i `homeScore` równa się
            `awayScore` — mecz pucharowy musi mieć zwycięzcę, a w sporcie
            dopuszczającym remis sam wynik go nie wyłania. Karne nie są
            zdobyczami: nie wchodzą do tabeli ani do statystyk.
        awayPenalties:
          type: [integer, 'null']
          minimum: 0
          description: Rzuty karne gościa. Niepuste dokładnie wtedy, gdy niepuste jest `homePenalties`.
        status: { $ref: '#/components/schemas/MatchStatus' }
        kickoffAt: { type: [string, 'null'], format: date-time }
        venue:
          oneOf:
            - $ref: '#/components/schemas/VenueSummary'
            - type: 'null'
        winnerToMatchId:
          type: [integer, 'null']
          format: int64
          description: Mecz, do którego wchodzi zwycięzca. Tylko w fazie `knockout`.
        loserToMatchId:
          type: [integer, 'null']
          format: int64
          description: |
            Mecz, do którego wchodzi przegrany. Tylko w fazie `knockout`
            i w praktyce tylko w półfinałach turnieju z meczem o 3. miejsce.

            Sam mecz o 3. miejsce rozpoznaje się po tym, że oba jego wejścia są
            krawędziami przegranego. Nie ma na to osobnej flagi.
        advancesToSlot:
          type: [string, 'null']
          enum: [home, away, null]
          description: |
            Strona, na którą uczestnicy tego meczu wchodzą w meczu docelowym.
            Wspólna dla obu krawędzi: strona wynika z pozycji meczu źródłowego,
            a nie z tego, kto awansuje, bo turniej pocieszenia jest lustrem
            drabinki głównej.

            Niepuste dokładnie wtedy, gdy niepuste jest co najmniej jedno
            z `winnerToMatchId` i `loserToMatchId`.

    StandingRow:
      type: object
      required: [position, team, played, won, drawn, lost, scoreFor, scoreAgainst, scoreDifference, points]
      properties:
        position: { type: integer, minimum: 1 }
        team: { $ref: '#/components/schemas/TeamSummary' }
        played: { type: integer, minimum: 0 }
        won: { type: integer, minimum: 0 }
        drawn:
          type: integer
          minimum: 0
          description: 'Zawsze zero w sporcie z `allowsDraw: false`, bo remis nie może w nim wystąpić.'
        lost: { type: integer, minimum: 0 }
        scoreFor:
          type: integer
          minimum: 0
          description: 'Zdobycze drużyny: bramki w piłce, punkty w koszykówce. Nie mylić z `points`.'
        scoreAgainst: { type: integer, minimum: 0 }
        scoreDifference: { type: integer }
        points:
          type: integer
          description: Punkty za wyniki meczów, zgodnie z `Tournament.points`. Nigdy zdobycze.

    StandingTable:
      type: object
      required: [stageId, stageName, groupId, groupName, scoreLabel, rows]
      properties:
        stageId: { type: integer, format: int64 }
        stageName: { type: string }
        groupId: { type: [integer, 'null'], format: int64 }
        groupName: { type: [string, 'null'] }
        scoreLabel:
          type: string
          description: |
            Nagłówek kolumny `scoreFor`:`scoreAgainst`, wyprowadzony ze sportu
            turnieju: „Bramki" w piłce nożnej, „Punkty" w koszykówce. Pola w API
            nazywają się `score*` niezależnie od sportu — tak przewiduje
            [ADR-0003](../../docs/adr/0003-zdobycze-nazywaja-sie-score-nie-goals.md).
            To, że etykietę niesie odpowiedź, a nie mapowanie po stronie klienta,
            ustala [ADR-0006](../../docs/adr/0006-etykiete-zdobyczy-niesie-odpowiedz-tabeli.md);
            `StatLeaderboard.label` robi to samo dla klasyfikacji.
        rows:
          type: array
          items: { $ref: '#/components/schemas/StandingRow' }

    StatLeaderboardRow:
      type: object
      required: [position, player, team, value]
      properties:
        position:
          type: integer
          minimum: 1
          description: |
            Przy równej liczbie zdarzeń pozycja jest **dzielona**: trzech
            zawodników z jedną bramką dostaje `position: 3` każdy, a kolejny
            wynik zaczyna się od 6. Wiersze ex aequo idą po `player.id`
            rosnąco — porządek ma być stabilny między odświeżeniami, a nie
            wartościujący, bo tabela nie zna kryterium rozstrzygającego.
        player: { $ref: '#/components/schemas/PlayerSummary' }
        team: { $ref: '#/components/schemas/TeamSummary' }
        value: { type: integer, minimum: 0 }

    StatLeaderboard:
      type: object
      required: [stat, label, rows]
      properties:
        stat:
          type: string
          description: Kod statystyki, zgodny z `availableStats` sportu.
        label: { type: string }
        rows:
          type: array
          items: { $ref: '#/components/schemas/StatLeaderboardRow' }

    PublicTournament:
      type: object
      required: [name, slug, status, sport, branding, stages]
      properties:
        name: { type: string }
        slug: { type: string }
        status: { $ref: '#/components/schemas/TournamentStatus' }
        sport: { $ref: '#/components/schemas/SportSummary' }
        branding: { $ref: '#/components/schemas/Branding' }
        stages:
          type: array
          items: { $ref: '#/components/schemas/Stage' }

  /public/t/{slug}/leaderboard:
    parameters:
      - { $ref: '#/components/parameters/Slug' }
      - { $ref: '#/components/parameters/IfNoneMatch' }
    get:
      tags: [Public]
      summary: Klasyfikacja indywidualna
      description: |
        Ranking zawodników według jednej statystyki sportu turnieju (bramki,
        kartki, punkty, faule). Statystyka zależy od sportu, dlatego odpowiedź
        niesie jej kod i etykietę zamiast zakładać, że chodzi o bramki
        (ADR-0006). Listę statystyk turnieju z etykietami daje
        `PublicTournament.stats`.

        Klasyfikacja nie jest bytem zapisywanym: liczy się przy każdym
        odczycie, jedna na turniej.

        - **Tylko mecze `finished`, ze wszystkich faz turnieju.** Mecz `live`
          niczego nie dokłada, tak samo jak w tabeli.
        - **Wartość** to suma `SportEventType.value` zdarzeń zawodnika, których
          typ ma `stat` równy wybranej statystyce: kartka i faul liczą się
          sztuką, rzuty sumują się po 1, 2 i 3. Typ ze `stat: null` (samobój)
          nie wchodzi do żadnej klasyfikacji.
        - **Lista** to wszyscy zawodnicy z `value > 0`, bez limitu i bez
          stronicowania. Przed pierwszym meczem zakończonym `rows` jest puste.
        - **Zdarzenie bez zawodnika** do klasyfikacji nie wchodzi. Zawodnik
          usunięty zostaje w niej z nazwiskiem.
        - `team` w wierszu to drużyna zdarzenia.

        Przykłady są dwa, po jednym na sport, zgodne z seedem demo: `pilka`
        (domyślny) i `koszykowka`. Mock zwraca drugi po wysłaniu nagłówka
        `Prefer: example=koszykowka`. Mock nie liczy klasyfikacji, więc
        parametr `stat` niczego w nim nie zmienia.
      security: []
      parameters:
        - name: stat
          in: query
          required: false
          description: |
            Kod statystyki z `availableStats` sportu turnieju (tak samo
            `PublicTournament.stats`). Bez parametru odpowiedź liczy pierwszą
            statystykę sportu: piłka `goals`, kosz `points`. Kod spoza
            `availableStats` sportu turnieju daje `422` pod `stat`, także kod
            innego sportu (`goals` w turnieju koszykarskim).
          schema: { type: string }
          example: yellowCards
      responses:
        '200':
          description: Klasyfikacja zawodników
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Cache-Control: { $ref: '#/components/headers/CacheControl' }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/StatLeaderboard' }
              examples:
                pilka:
                  summary: Turniej piłkarski — domyślna klasyfikacja to bramki
                  value:
                    data:
                      stat: goals
                      label: Bramki
                      rows:
                        - { position: 1, player: { id: 1, name: Marek Nowak }, team: { id: 1, name: Wilki Bemowo, logoUrl: null }, value: 3 }
                        - { position: 2, player: { id: 5, name: Adam Zieliński }, team: { id: 2, name: Sokoły Ursus, logoUrl: null }, value: 2 }
                        - { position: 3, player: { id: 3, name: Jakub Wrona }, team: { id: 1, name: Wilki Bemowo, logoUrl: null }, value: 1 }
                        - { position: 3, player: { id: 4, name: Tomasz Lis }, team: { id: 2, name: Sokoły Ursus, logoUrl: null }, value: 1 }
                        - { position: 3, player: { id: 7, name: Rafał Duda }, team: { id: 3, name: Orły Bielany, logoUrl: null }, value: 1 }
                koszykowka:
                  summary: Turniej koszykarski — domyślna klasyfikacja to punkty
                  description: |
                    Liga koszykówki z seedu demo (`liga-koszykowki-2026`).
                    Punkty zawodników sumują się do wyników meczów (168:141
                    w tabeli), bo seed rozpisuje każdy wynik na rzuty.
                  value:
                    data:
                      stat: points
                      label: Punkty
                      rows:
                        - { position: 1, player: { id: 11, name: Oskar Dąb }, team: { id: 4, name: Żubry Wola, logoUrl: null }, value: 57 }
                        - { position: 1, player: { id: 12, name: Bruno Klon }, team: { id: 4, name: Żubry Wola, logoUrl: null }, value: 57 }
                        - { position: 3, player: { id: 10, name: Kacper Lipa }, team: { id: 4, name: Żubry Wola, logoUrl: null }, value: 54 }
                        - { position: 4, player: { id: 15, name: Wiktor Bóbr }, team: { id: 5, name: Rysie Mokotów, logoUrl: null }, value: 48 }
                        - { position: 5, player: { id: 14, name: Hubert Łoś }, team: { id: 5, name: Rysie Mokotów, logoUrl: null }, value: 47 }
                        - { position: 6, player: { id: 13, name: Filip Sarna }, team: { id: 5, name: Rysie Mokotów, logoUrl: null }, value: 46 }
        '304': { $ref: '#/components/responses/NotModified' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Token wydany przez `/login` lub `/register`, bez daty wygaśnięcia.

  parameters:
    TournamentId:
      name: tournament
      in: path
      required: true
      schema: { type: integer, format: int64 }
    TeamId:
      name: team
      in: path
      required: true
      schema: { type: integer, format: int64 }
    PlayerId:
      name: player
      in: path
      required: true
      schema: { type: integer, format: int64 }
    VenueId:
      name: venue
      in: path
      required: true
      schema: { type: integer, format: int64 }
    StageId:
      name: stage
      in: path
      required: true
      schema: { type: integer, format: int64 }
    MatchId:
      name: match
      in: path
      required: true
      schema: { type: integer, format: int64 }
    MatchEventId:
      name: event
      in: path
      required: true
      schema: { type: integer, format: int64 }
    Slug:
      name: slug
      in: path
      required: true
      description: |
        Slug turnieju. Turniej w `draft` jest traktowany jak nieistniejący:
        każda trasa `/public/t/{slug}*` odpowiada wtedy tym samym `404`, z tym
        samym komunikatem co dla nieznanego sluga, żeby odpowiedź nie zdradzała,
        że turniej istnieje.
      schema: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$' }
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: |
        Walidator z poprzedniej odpowiedzi. Zgodny daje `304` z pustym ciałem
        zamiast pełnego JSON-a. Przeglądarka wysyła ten nagłówek sama, ze swojej
        pamięci podręcznej, i sama zamienia `304` z powrotem na `200` — kod
        frontendu go nie ustawia. Jawnie ustawia go klient bez pamięci
        podręcznej: testy kontraktowe i integracje.
      schema: { type: string }
      example: '"9f2b1c4e"'

  headers:
    ETag:
      description: |
        Walidator treści odpowiedzi, nieprzezroczysty dla klienta. Zmienia się
        wtedy i tylko wtedy, gdy zmienia się `data`.
      required: true
      schema: { type: string }
      example: '"9f2b1c4e"'
    CacheControl:
      description: |
        Musi zawierać dyrektywę `no-cache`: przeglądarka może odpowiedź
        zachować, ale przed każdym użyciem musi ją odświeżyć warunkowo. Bez
        tego heurystyka pamięci podręcznej pokazałaby nieaktualną tabelę,
        a walidator nigdy nie doszedłby do serwera.

        Nagłówek jest listą dyrektyw, więc kontrakt wymaga obecności
        `no-cache`, a nie konkretnego napisu — Laravel domyślnie oddaje
        `no-cache, private` i to jest zgodne.
      required: true
      schema:
        type: string
        pattern: '(^|,)\s*no-cache\s*(,|$)'
      example: no-cache, private

  responses:
    NotModified:
      description: |
        Treść nie zmieniła się od walidatora podanego w `If-None-Match`.
        Ciało jest puste — poprzednia odpowiedź pozostaje aktualna.
      headers:
        ETag: { $ref: '#/components/headers/ETag' }
        Cache-Control: { $ref: '#/components/headers/CacheControl' }
    Unauthenticated:
      description: Brak lub nieważny token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { message: Wymagane zalogowanie. }
    Forbidden:
      description: Zasób należy do innego organizera
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { message: Brak dostępu do zasobu. }
    NotFound:
      description: Zasób nie istnieje
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { message: Nie znaleziono zasobu. }
    BadRequest:
      description: Żądanie odrzucone przed trasą, np. ścieżka URL z niepoprawnym UTF-8
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { message: Niepoprawny adres URL. }
    MethodNotAllowed:
      description: Metoda HTTP nieobsługiwana przez ścieżkę; dozwolone podaje nagłówek `Allow`
      headers:
        Allow:
          description: Metody obsługiwane przez ścieżkę, np. `POST`
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { message: Metoda niedozwolona dla tego zasobu. }
    PayloadTooLarge:
      description: Ciało żądania przekracza limit serwera
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { message: Przesłane dane są za duże. }
    ServerError:
      description: Nieoczekiwany błąd serwera
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { message: Wewnętrzny błąd serwera. }
    ServiceUnavailable:
      description: Usługa chwilowo niedostępna, np. tryb konserwacji
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { message: Usługa chwilowo niedostępna. }
    ValidationError:
      description: Dane nie przeszły walidacji
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ValidationError' }
          example:
            message: Pole nazwa jest wymagane.
            errors:
              name: [Pole nazwa jest wymagane.]
    MatchEventInvalid:
      description: Zdarzenie niezgodne ze sportem, meczem albo składem, albo mecz jest zaplanowany
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ValidationError' }
          examples:
            obcyTyp:
              summary: Typ spoza `eventTypes` sportu turnieju
              value:
                message: Ten sport nie zna takiego zdarzenia.
                errors:
                  type: [Ten sport nie zna takiego zdarzenia.]
            bezZawodnika:
              summary: '`hasPlayer: true` bez `playerId`'
              value:
                message: Wskaż zawodnika.
                errors:
                  playerId: [Wskaż zawodnika.]
            obcaDruzyna:
              summary: Drużyna, która nie gra w tym meczu
              value:
                message: Ta drużyna nie gra w tym meczu.
                errors:
                  teamId: [Ta drużyna nie gra w tym meczu.]
            obcyZawodnik:
              summary: Zawodnik innej drużyny albo usunięty
              value:
                message: Zawodnik nie gra w wybranej drużynie.
                errors:
                  playerId: [Zawodnik nie gra w wybranej drużynie.]
            meczZaplanowany:
              summary: Mecz `scheduled`
              value:
                message: Zdarzenia wpisuje się w meczu trwającym albo zakończonym.
                errors:
                  match: [Zdarzenia wpisuje się w meczu trwającym albo zakończonym.]
    DeleteBlocked:
      description: Usunięcie zablokowane przez mecze rozegrane albo trwające
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ValidationError' }
          example:
            message: 'Nie można usunąć: turniej „Liga Osiedlowa 2026” ma rozegrane lub trwające mecze.'
            errors:
              id: ['Nie można usunąć: turniej „Liga Osiedlowa 2026” ma rozegrane lub trwające mecze.']

  schemas:
    Error:
      type: object
      required: [message]
      properties:
        message: { type: string }

    ValidationError:
      type: object
      required: [message, errors]
      properties:
        message:
          type: string
          description: |
            Pierwszy komunikat z `errors`, a przy kilku błędach naraz
            z doklejonym liczebnikiem pozostałych: „Pole nazwa jest wymagane.
            (i jeszcze 3 błędy)". To nie jest zdanie ogólne, tylko konkret
            pierwszego błędu (przy logowaniu: „Nieprawidłowy e-mail lub
            hasło."), więc nadaje się na komunikat zbiorczy — toast albo
            nagłówek formularza. Pod samym polem pokaż wpis z `errors`, bo
            inaczej ten sam tekst wyjdzie dwa razy.
            Tekst ogólny („Podane dane są nieprawidłowe.") pada wyłącznie
            wtedy, gdy mapa `errors` jest pusta.
        errors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }

    PaginationMeta:
      type: object
      required: [currentPage, lastPage, perPage, total]
      properties:
        currentPage: { type: integer, minimum: 1 }
        lastPage: { type: integer, minimum: 1 }
        perPage: { type: integer, minimum: 1 }
        total: { type: integer, minimum: 0 }

    User:
      type: object
      required: [id, name, email, createdAt]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        email: { type: string, format: email }
        createdAt: { type: string, format: date-time }

    AuthPayload:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
          description: |
            Do wysłania w nagłówku `Authorization: Bearer <token>`. Dla klienta
            nieprzezroczysty: jego długość i budowa nie są częścią kontraktu,
            więc nie waliduj go po stronie frontu ani nie rozbieraj na części.
        user: { $ref: '#/components/schemas/User' }

    SportCode:
      type: string
      enum: [football, basketball]

    Points:
      type: object
      required: [win, draw, loss]
      description: |
        Punktacja: ile punktów w tabeli daje wygrana, remis i porażka. Obowiązuje
        porządek `loss < win`, a w sporcie z remisami (`allowsDraw: true`) także
        `loss ≤ draw ≤ win`. Naruszenie porządku daje `422` pod `points`.
        Wartość spoza zakresu daje `422` pod `points.win`, `points.draw` albo
        `points.loss`.
      properties:
        win: { type: integer, minimum: 0, maximum: 10 }
        draw:
          type: integer
          minimum: 0
          maximum: 10
          description: |
            Punkty za remis. W sporcie z `allowsDraw: false` remis nie może
            wystąpić, więc wartość musi wynosić zero: inna daje `422` pod
            `points.draw` i nie jest zerowana. Do porządku `loss ≤ draw ≤ win`
            `draw` wtedy nie wchodzi, bo np. koszykówka ma `draw: 0` i `loss: 1`.
        loss: { type: integer, minimum: 0, maximum: 10 }

    SportEventType:
      type: object
      required: [code, label, hasPlayer, value, stat]
      properties:
        code: { type: string }
        label: { type: string }
        hasPlayer:
          type: boolean
          description: Czy zdarzenie wymaga wskazania zawodnika.
        value:
          type: integer
          minimum: 1
          description: |
            Wkład jednego zdarzenia do statystyki `stat`, np. 3 przy rzucie
            za 3 w koszykówce. Ustawiony jawnie przy każdym typie, także gdy
            wynosi 1: konsument nie przyjmuje domyślnej jedynki.
        stat:
          type: [string, 'null']
          description: Kod statystyki, do której zdarzenie się wlicza. `null` oznacza zdarzenie bez wpływu na statystyki.

    SportConfig:
      type: object
      required: [allowsDraw, defaultPoints, defaultMatchDuration, defaultPeriods, eventTypes, defaultTiebreakers, availableTiebreakers, tiebreakerLabels, availableStats, statLabels]
      properties:
        allowsDraw:
          type: boolean
          description: Czy w tym sporcie mecz może zakończyć się remisem.
        defaultPoints: { $ref: '#/components/schemas/Points' }
        defaultMatchDuration:
          type: integer
          minimum: 10
          maximum: 600
          description: |
            Domyślna długość meczu w minutach, razem z przerwą po nim,
            kopiowana do turnieju przy zakładaniu (`Tournament.matchDuration`).
            Wartości amatorskie: piłka nożna 60, koszykówka 40.
        defaultPeriods:
          allOf:
            - $ref: '#/components/schemas/MatchPeriods'
          description: |
            Domyślny podział meczu na części, kopiowany do turnieju przy
            zakładaniu (`Tournament.periods`), wzorem `defaultMatchDuration`.
            Piłka nożna `{ count: 2, minutes: 45 }`, koszykówka
            `{ count: 4, minutes: 10 }`. Z `defaultMatchDuration` się go nie
            wylicza: tamta długość jest amatorska i zawiera przerwę.
        eventTypes:
          type: array
          items: { $ref: '#/components/schemas/SportEventType' }
        defaultTiebreakers:
          type: array
          description: |
            Kolejność tiebreaków, którą turniej dostaje przy zakładaniu.
            Podzbiór `availableTiebreakers`; organizer zmienia ją potem
            u siebie przez `PATCH /tournaments/{tournament}`.
          items: { $ref: '#/components/schemas/TiebreakerCode' }
        availableTiebreakers:
          type: array
          items: { $ref: '#/components/schemas/TiebreakerCode' }
        tiebreakerLabels:
          type: object
          description: |
            Polska etykieta każdego kryterium z `availableTiebreakers` tego
            sportu; klucze to dokładnie `availableTiebreakers`, bez braków
            i bez nadmiaru. Etykieta zależy od sportu, bo kryteria liczone ze
            zdobyczy nazywają zdobycze („Różnica bramek” albo „Różnica
            punktów”). `points` oznacza punkty w tabeli, a nie zdobycze.
          additionalProperties: { type: string, minLength: 1 }
        availableStats:
          type: array
          description: |
            Kody statystyk, według których liczy się klasyfikacja
            (`StatLeaderboard`). Pierwszy wpis to klasyfikacja domyślna:
            piłka `goals`, kosz `points`.
          items: { type: string }
        statLabels:
          type: object
          description: |
            Polska etykieta każdej statystyki z `availableStats` tego sportu;
            klucze to dokładnie `availableStats`, bez braków i bez nadmiaru,
            wzorem `tiebreakerLabels`. Ta sama etykieta przychodzi
            w `StatLeaderboard.label` i `PublicTournament.stats`.
          additionalProperties: { type: string, minLength: 1 }

    Sport:
      type: object
      required: [id, code, name, config]
      properties:
        id: { type: integer, format: int64 }
        code: { $ref: '#/components/schemas/SportCode' }
        name: { type: string }
        config: { $ref: '#/components/schemas/SportConfig' }

    SportSummary:
      type: object
      required: [id, code, name]
      properties:
        id: { type: integer, format: int64 }
        code: { $ref: '#/components/schemas/SportCode' }
        name: { type: string }

    TiebreakerCode:
      type: string
      description: |
        Kryterium rozstrzygające o kolejności w tabeli. `points` jest zawsze
        pierwsze na liście turnieju. `score_against` stawia wyżej drużynę,
        która straciła mniej, pozostałe kryteria drużynę z wyższą wartością.

        `head_to_head` to mini-tabela z zakończonych meczów między remisującymi
        drużynami, sortowana po punktach, bilansie i zdobyczach w tych meczach.
        Nie zagłębia się rekurencyjnie: drużyny, których mini-tabela nie
        rozdzieliła, idą do następnego kryterium z listy, bez powrotu do
        `head_to_head`. Kryterium jest pomijane, dopóki w fazie istnieje
        niezakończony mecz między remisującymi.
      enum: [points, head_to_head, score_diff, score_for, score_against, wins]

    TournamentStatus:
      type: string
      description: |
        Stan turnieju.

        - `draft` — turniej nieopublikowany. Nowy turniej zaczyna w tym stanie.
        - `active` i `finished` — turniej opublikowany. `finished` to
          deklaracja organizera, że rozgrywki się skończyły. Nie blokuje żadnej
          zmiany ani usunięcia.

        Status ustawia wyłącznie organizer, przez
        `PATCH /tournaments/{tournament}`. Żadna operacja systemu nie zmienia
        go sama.
      enum: [draft, active, finished]

    TournamentFormat:
      type: string
      description: |
        Używane wyłącznie przy zakładaniu turnieju, żeby wiedzieć jakie fazy
        utworzyć. Nie jest polem turnieju: strukturę opisują fazy.
      enum: [league, groups_playoff, knockout]

    Branding:
      type: object
      required: [logoUrl, primaryColor]
      properties:
        logoUrl:
          type: [string, 'null']
          format: uri
          description: |
            Adres absolutny pliku. Zmienia się przy każdym uploadzie. `null`,
            gdy logo nie wgrano albo je usunięto.
        primaryColor:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'

    MatchPeriods:
      type: object
      required: [count, minutes]
      description: |
        Podział meczu na części (połowy, tercje, kwarty). Etykieta części
        wynika z ich liczby, a nie ze sportu: 2 → „połowa”, 3 → „tercja”,
        4 → „kwarta”, inna liczba → „część”. Serwer składa ją z numerem,
        np. „1. połowa” (`PublicMatchPeriod.label`).

        Przy zapisie (`TournamentUpdate.periods`) `count` spoza 1–10 daje
        `422` pod `periods.count`, a `minutes` niezgodne z `count` — liczba
        przy jednej części albo brak liczby (lub liczba spoza 1–150) przy
        kilku — `422` pod `periods.minutes`.
      properties:
        count:
          type: integer
          minimum: 1
          maximum: 10
          description: Liczba części. `1` znaczy „bez podziału”.
        minutes:
          type: [integer, 'null']
          minimum: 1
          maximum: 150
          description: |
            Długość jednej części w minutach. `null` wtedy i tylko wtedy, gdy
            `count` wynosi 1.

    Tournament:
      type: object
      required: [id, name, slug, status, sport, branding, points, tiebreakers, matchDuration, periods, teamsCount, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        slug: { type: string }
        status: { $ref: '#/components/schemas/TournamentStatus' }
        sport: { $ref: '#/components/schemas/SportSummary' }
        branding: { $ref: '#/components/schemas/Branding' }
        points:
          allOf:
            - $ref: '#/components/schemas/Points'
          description: Punktacja obowiązująca w tym turnieju, wyjściowo skopiowana z domyślnej dla sportu.
        tiebreakers:
          type: array
          items: { $ref: '#/components/schemas/TiebreakerCode' }
          description: Uporządkowana lista kryteriów, stosowanych po kolei.
        matchDuration:
          type: integer
          minimum: 10
          maximum: 600
          description: |
            Długość meczu w minutach, razem z przerwą po nim. Wyznacza slot
            rozkładu dat (`POST /stages/{stage}/schedule/dates`) i okno kolizji
            (`AdminMatch.collisions`). Turniej dostaje ją przy zakładaniu jako
            kopię `SportConfig.defaultMatchDuration`, a potem organizer zmienia
            ją u siebie. Zmiana nie przesuwa żadnego `kickoffAt` — zmienia tylko
            to, co liczy się jako kolizja.
        periods:
          allOf:
            - $ref: '#/components/schemas/MatchPeriods'
          description: |
            Podział meczu turnieju. Turniej dostaje go przy zakładaniu jako
            kopię `SportConfig.defaultPeriods`, a potem organizer zmienia go
            u siebie. Zmiana działa wstecz na wszystkie mecze turnieju: część
            zdarzenia liczy się przy odczycie z jego minuty
            (`PublicMatchEvent.period`), a w zdarzeniach nic się nie zapisuje.
        teamsCount: { type: integer, minimum: 0 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    TournamentCreate:
      type: object
      required: [name, sportId, format]
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
        sportId: { type: integer, format: int64 }
        format: { $ref: '#/components/schemas/TournamentFormat' }

    TournamentUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
        slug: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$', minLength: 3, maxLength: 80 }
        status: { $ref: '#/components/schemas/TournamentStatus' }
        matchDuration:
          type: integer
          minimum: 10
          maximum: 600
          description: |
            Długość meczu w minutach (10–600), razem z przerwą po nim.
            Zmiana nie przesuwa terminów meczów: zmienia tylko to, co liczy się
            jako kolizja.
        periods:
          allOf:
            - $ref: '#/components/schemas/MatchPeriods'
          description: |
            Podział meczu (`Tournament.periods`). Przychodzi w komplecie albo
            wcale; reguły i klucze błędów opisuje `MatchPeriods`. Zmiana
            przelicza relacje wszystkich meczów turnieju na stronie publicznej.
        branding:
          type: object
          additionalProperties: false
          description: |
            Branding jest zagnieżdżony tak samo jak w odczycie
            (`Tournament.branding`), żeby formularz panelu nie musiał go
            spłaszczać i rozwijać z powrotem. Zapisywalne jest tu wyłącznie
            `primaryColor`: logo wgrywa się przez
            `POST /tournaments/{tournament}/logo`, więc `logoUrl` w tym kształcie
            nie występuje.
          properties:
            primaryColor: { type: string, pattern: '^#[0-9A-Fa-f]{6}$' }
        points: { $ref: '#/components/schemas/Points' }
        tiebreakers:
          type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: '#/components/schemas/TiebreakerCode' }
          description: |
            Dowolny podzbiór `availableTiebreakers` sportu turnieju, w dowolnej
            kolejności, z `points` na pierwszym miejscu. Samo `[points]` jest
            poprawne. Backend niczego nie poprawia, tylko odrzuca: kod spoza
            enuma, kod niedostępny w sporcie i duplikat dają `422` pod
            `tiebreakers.N`, brak `points` na początku daje `422` pod
            `tiebreakers.0`, a pusta lista pod `tiebreakers`.

    StageType:
      type: string
      description: |
        `league` to jedna tabela, `group` to kilka niezależnych tabel,
        `knockout` to drabinka. Turniej ma zawsze co najmniej jedną fazę.
      enum: [league, group, knockout]

    Group:
      type: object
      required: [id, name]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }

    Stage:
      type: object
      required: [id, type, name, order, groups]
      properties:
        id: { type: integer, format: int64 }
        type: { $ref: '#/components/schemas/StageType' }
        name: { type: string }
        order: { type: integer, minimum: 1 }
        groups:
          type: array
          description: |
            Pusta dla faz `league` i `knockout`. W fazie `group` pusta, dopóki
            organizer nie utworzy grup — faza powstaje przy zakładaniu turnieju
            bez nich.
          items: { $ref: '#/components/schemas/Group' }

    RoundSummary:
      type: object
      description: |
        Uporządkowany zbiór meczów rozgrywanych razem. W fazie `league` i `group`
        nazywany w interfejsie kolejką, w fazie `knockout` rundą. W API to jeden byt.
      required: [id, name, order]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        order: { type: integer, minimum: 1 }

    Team:
      type: object
      required: [id, tournamentId, name, logoUrl, groupId, playersCount, scheduledMatchesCount]
      properties:
        id: { type: integer, format: int64 }
        tournamentId: { type: integer, format: int64 }
        name: { type: string }
        logoUrl:
          type: [string, 'null']
          format: uri
          description: |
            Adres absolutny pliku. Zmienia się przy każdym uploadzie. `null`,
            gdy logo nie wgrano albo je usunięto.
        groupId:
          type: [integer, 'null']
          format: int64
          description: Grupa w fazie `group`. `null`, gdy turniej nie ma fazy grupowej.
        playersCount:
          type: integer
          minimum: 0
          description: Liczba zawodników drużyny, bez usuniętych.
        scheduledMatchesCount:
          type: integer
          minimum: 0
          description: |
            Liczba meczów `scheduled` drużyny, jako gospodarza i jako gościa.
            Mecze `live` i `finished` się nie liczą. Tyle meczów zniknie
            z terminarza razem z drużyną (`DELETE /teams/{team}`).

    TeamSummary:
      type: object
      required: [id, name, logoUrl]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        logoUrl:
          type: [string, 'null']
          format: uri
          description: |
            Adres absolutny pliku. Zmienia się przy każdym uploadzie. `null`,
            gdy logo nie wgrano albo je usunięto.

    Player:
      type: object
      required: [id, teamId, name, number, position]
      properties:
        id: { type: integer, format: int64 }
        teamId: { type: integer, format: int64 }
        name: { type: string }
        number: { type: [integer, 'null'] }
        position: { type: [string, 'null'] }

    PlayerSummary:
      type: object
      required: [id, name]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }

    MatchEvent:
      type: object
      description: |
        Zdarzenie meczu: bramka, kartka, rzut, faul. Typy i ich etykiety
        pochodzą z `SportConfig.eventTypes` sportu turnieju. Samobój należy do
        drużyny zawodnika, który go strzelił.
      required: [id, team, player, type, typeLabel, minute]
      properties:
        id: { type: integer, format: int64 }
        team: { $ref: '#/components/schemas/TeamSummary' }
        player:
          oneOf:
            - { $ref: '#/components/schemas/PlayerSummary' }
            - { type: 'null' }
          description: '`null` przy typie z `hasPlayer: false`.'
        type:
          type: string
          description: Kod typu z `SportConfig.eventTypes`.
        typeLabel:
          type: string
          description: Etykieta typu z konfiguracji sportu, np. „Rzut za 3”.
        minute:
          type: [integer, 'null']
          minimum: 1
          maximum: 150
          description: |
            Minuta meczu. Doliczony czas zapisuje się zwykłą liczbą
            („90+3” → `93`). `null`, gdy minuty nie wpisano.

    MatchEventCreate:
      type: object
      description: |
        Reguły zapisu, sprawdzane także przy `PATCH` po scaleniu z zapisanym
        zdarzeniem:

        - `type` spoza `eventTypes` sportu turnieju daje `422` pod `type`;
        - `teamId` musi być gospodarzem albo gościem meczu, inaczej `422` pod
          `teamId`;
        - przy `hasPlayer: true` `playerId` jest wymagany, a przy
          `hasPlayer: false` zabroniony — oba przypadki dają `422` pod
          `playerId`;
        - zawodnik musi należeć do drużyny `teamId` i nie być usunięty,
          inaczej `422` pod `playerId`;
        - zdarzenie meczu `scheduled` daje `422` pod `match`.
      required: [type, teamId, playerId, minute]
      properties:
        type: { type: string }
        teamId: { type: integer, format: int64 }
        playerId: { type: [integer, 'null'], format: int64 }
        minute: { type: [integer, 'null'], minimum: 1, maximum: 150 }

    MatchEventUpdate:
      type: object
      description: Częściowa zmiana zdarzenia. Pole nieobecne zostaje bez zmian; reguły jak w `MatchEventCreate`, po scaleniu.
      properties:
        type: { type: string }
        teamId: { type: integer, format: int64 }
        playerId: { type: [integer, 'null'], format: int64 }
        minute: { type: [integer, 'null'], minimum: 1, maximum: 150 }

    Venue:
      type: object
      required: [id, tournamentId, name, address, scheduledMatchesCount]
      properties:
        id: { type: integer, format: int64 }
        tournamentId: { type: integer, format: int64 }
        name: { type: string }
        address: { type: [string, 'null'] }
        scheduledMatchesCount:
          type: integer
          minimum: 0
          description: |
            Liczba meczów `scheduled` na tym obiekcie. Mecze `live`
            i `finished` się nie liczą. Tyle meczów straci obiekt, gdy ten
            zostanie usunięty (`DELETE /venues/{venue}`).

    VenueSummary:
      type: object
      required: [id, name]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }

    MatchStatus:
      type: string
      description: Tylko mecz `finished` wpływa na tabelę i statystyki.
      enum: [scheduled, live, finished]

    Match:
      type: object
      description: |
        Kształt zamrożony w v0.1. Pola drabinkowe (`winnerToMatchId`,
        `loserToMatchId`, `advancesToSlot`) opisuje
        [ADR-0004](../../docs/adr/0004-drabinka-pozycja-wlasna-i-propagacja-osobno.md).
      required: [id, stageId, groupId, round, matchNumber, homeTeam, awayTeam, homeScore, awayScore, homePenalties, awayPenalties, status, kickoffAt, venue, winnerToMatchId, loserToMatchId, advancesToSlot]
      properties:
        id: { type: integer, format: int64 }
        stageId: { type: integer, format: int64 }
        groupId:
          type: [integer, 'null']
          format: int64
          description: Grupa, w ramach której mecz się liczy. `null` poza fazą `group`. Nie istnieje mecz międzygrupowy.
        round: { $ref: '#/components/schemas/RoundSummary' }
        matchNumber:
          type: integer
          minimum: 1
          description: |
            Numer meczu w obrębie rundy, liczony od jedynki. W drabince razem
            z `round.order` tworzy pozycję własną meczu, z której widok wylicza
            etykietę pozycji („Półfinał 1”, „Finał”) — tej etykiety nie ma
            w danych, a nazwa rundy jest w `round.name`. Numer to pozycja
            w pełnej drabince, więc w pierwszej rundzie ma dziury w miejscach
            wolnych losów. W lidze daje stabilną kolejność meczów
            w kolejce i niczego więcej nie znaczy, więc może mieć dziury (np.
            po usunięciu drużyny razem z jej meczami `scheduled`).
        homeTeam:
          oneOf:
            - $ref: '#/components/schemas/TeamSummary'
            - type: 'null'
          description: |
            `null`, gdy miejsce w drabince nie jest jeszcze rozstrzygnięte.

            Pauza (bye) **nie** tworzy meczu. W lidze nieparzystej kolejka ma po
            prostu o jeden mecz mniej. W drabince pauza objawia się tym, że slot
            poza pierwszą rundą jest obsadzony drużyną, a nie prowadzi do niego
            żadna krawędź: żaden mecz nie wskazuje go przez `winnerToMatchId`
            ani `loserToMatchId`. Osobnego pola na pauzę nie ma — tak przewiduje
            [ADR-0004](../../docs/adr/0004-drabinka-pozycja-wlasna-i-propagacja-osobno.md).
        awayTeam:
          oneOf:
            - $ref: '#/components/schemas/TeamSummary'
            - type: 'null'
        homeScore: { type: [integer, 'null'], minimum: 0 }
        awayScore: { type: [integer, 'null'], minimum: 0 }
        homePenalties:
          type: [integer, 'null']
          minimum: 0
          description: |
            Rzuty karne gospodarza. Niepuste wyłącznie wtedy, gdy mecz jest
            w fazie `knockout`, jest zakończony i `homeScore` równa się
            `awayScore` — mecz pucharowy musi mieć zwycięzcę, a w sporcie
            dopuszczającym remis sam wynik go nie wyłania. Karne nie są
            zdobyczami: nie wchodzą do tabeli ani do statystyk.
        awayPenalties:
          type: [integer, 'null']
          minimum: 0
          description: Rzuty karne gościa. Niepuste dokładnie wtedy, gdy niepuste jest `homePenalties`.
        status: { $ref: '#/components/schemas/MatchStatus' }
        kickoffAt: { type: [string, 'null'], format: date-time }
        venue:
          oneOf:
            - $ref: '#/components/schemas/VenueSummary'
            - type: 'null'
        winnerToMatchId:
          type: [integer, 'null']
          format: int64
          description: Mecz, do którego wchodzi zwycięzca. Tylko w fazie `knockout`.
        loserToMatchId:
          type: [integer, 'null']
          format: int64
          description: |
            Mecz, do którego wchodzi przegrany. Tylko w fazie `knockout`
            i w praktyce tylko w półfinałach turnieju z meczem o 3. miejsce.

            Sam mecz o 3. miejsce rozpoznaje się po tym, że oba jego wejścia są
            krawędziami przegranego. Nie ma na to osobnej flagi.
        advancesToSlot:
          type: [string, 'null']
          enum: [home, away, null]
          description: |
            Strona, na którą uczestnicy tego meczu wchodzą w meczu docelowym.
            Wspólna dla obu krawędzi: strona wynika z pozycji meczu źródłowego,
            a nie z tego, kto awansuje, bo turniej pocieszenia jest lustrem
            drabinki głównej.

            Niepuste dokładnie wtedy, gdy niepuste jest co najmniej jedno
            z `winnerToMatchId` i `loserToMatchId`.

    MatchUpdate:
      type: object
      description: |
        Częściowa zmiana meczu: wynik, stan, termin i obiekt. Pole nieobecne
        zostaje bez zmian, a `null` czyści pole, które je dopuszcza.

        Spójność wyniku ze stanem (#159), sprawdzana po scaleniu ciała żądania
        z zapisanym meczem, bo `PATCH` jest częściowy:

        | stan | `homeScore` i `awayScore` |
        |---|---|
        | `scheduled` | oba `null` |
        | `live` | oba liczbami |
        | `finished` | oba liczbami, a przy `allowsDraw: false` różne |

        Wszystkie błędy pary wyników wracają pod klucz `homeScore`, bo
        organizator poprawia je liczbami, a nie stanem: jeden wynik pusty,
        wynik przy `scheduled`, brak wyniku przy `live` albo `finished` oraz
        remis przy `finished` w sporcie bez remisów. Powrót do `scheduled`
        nie czyści wyniku sam — klient musi wysłać `homeScore: null`
        i `awayScore: null` jawnie, inaczej `422`.

        Przejścia między stanami są dowolne (także `scheduled` → `finished`
        bez `live`): nic nie przestawia meczu po upływie `kickoffAt` ani
        `matchDuration`. Wynik wolno wpisać meczowi bez `kickoffAt` i w turnieju
        `draft`, a wynik meczu `finished` zmienia się zawsze, bez ostrzeżenia —
        tabela liczy się przy odczycie.

        Meczu, który ma zdarzenia, nie da się cofnąć do `scheduled`: daje to
        `422` pod `status`, a zdarzeń nic nie kasuje kaskadowo. Organizator
        usuwa je najpierw sam (`DELETE /match-events/{event}`).

        Termin i obiekt wolno korygować przy każdym stanie meczu, także
        `finished` (#158). `kickoffAt` wymaga offsetu (ADR-0008), a `venueId`
        musi należeć do tego turnieju i nie być usunięty.

        **Karne** (#216), sprawdzane po scaleniu tak samo jak wynik:

        | warunek po scaleniu | `homePenalties` i `awayPenalties` |
        |---|---|
        | faza `knockout`, `finished`, `homeScore = awayScore` | oba wymagane, różne |
        | każdy inny | oba `null` |

        Błędy karnych wracają pod klucz `homePenalties`, wzorem `homeScore`.
        Karne nie czyszczą się same: zmiana 1:1 (k. 4:3) na 2:1 bez jawnego
        `homePenalties: null` i `awayPenalties: null` daje `422`, tak jak
        powrót do `scheduled` z wynikiem. W sporcie bez remisów remis przy
        `finished` jest błędem wyniku, więc karne nie mają tam kiedy wejść.

        Mecz bez obu drużyn (pusty slot drabinki) może być tylko `scheduled`:
        `live` albo `finished` daje `422` pod `status`. Termin i obiekt wolno
        mu ustawić.

        **Awans** (#216), tylko w drabince:

        - Zwycięzca wchodzi do meczu `winnerToMatchId`, a przegrany do
          `loserToMatchId`, na stronę `advancesToSlot`, w chwili, gdy mecz
          zostaje `finished`. Zwycięzcę wyłania wynik, a przy remisie karne.
          Stan `live` nikogo nie wpuszcza.
        - Gdy zmienia się zwycięzca (inny wynik albo inne karne) albo mecz
          wraca z `finished` do `live` czy `scheduled`, serwer w tej samej
          transakcji podmienia albo zeruje drużynę w obu meczach zależnych.
          Termin, obiekt i druga drużyna meczu zależnego zostają.
        - **Blokada**: jeśli którykolwiek mecz zależny, w którym zmieniłaby się
          drużyna, jest `live` albo `finished`, cała zmiana daje `422` i nic
          się nie zapisuje. Klucz to `homeScore`, a `status`, gdy ciało nie
          niesie wyniku ani karnych, tylko stan. Organizator cofa mecze od
          końca.
        - Zmiana wyniku albo karnych bez zmiany zwycięzcy zawsze przechodzi
          i niczego dalej nie rusza. Slotu po wolnym losie nic nie dotyka, bo
          nie prowadzi do niego żadna krawędź.
      properties:
        homeScore: { type: [integer, 'null'], minimum: 0, maximum: 999 }
        awayScore: { type: [integer, 'null'], minimum: 0, maximum: 999 }
        homePenalties:
          type: [integer, 'null']
          minimum: 0
          maximum: 99
          description: Rzuty karne gospodarza. Reguły w opisie `MatchUpdate`.
        awayPenalties:
          type: [integer, 'null']
          minimum: 0
          maximum: 99
          description: Rzuty karne gościa. Reguły w opisie `MatchUpdate`.
        status: { $ref: '#/components/schemas/MatchStatus' }
        kickoffAt:
          type: [string, 'null']
          format: date-time
          description: |
            Termin meczu. **Wymagany offset** (np. `+02:00` albo `Z`): data bez
            offsetu daje `422`, bo nie wiadomo, który moment organizator miał na
            myśli (ADR-0008). `null` znaczy „termin do ustalenia”.
        venueId:
          type: [integer, 'null']
          format: int64
          description: |
            Obiekt turnieju, na którym gra mecz. `null` znaczy „bez obiektu”.
            Obcy turniejowi albo usunięty obiekt daje `422`.

    MatchCollisionType:
      type: string
      description: |
        Rodzaj kolizji terminu. `team` to „Kolizja drużyny” (wspólna drużyna),
        `venue` to „Kolizja boiska” (ten sam obiekt).
      enum: [team, venue]

    MatchCollision:
      type: object
      required: [type, matchId]
      description: |
        Kolizja tego meczu z innym meczem **tego samego turnieju**, także
        z innej fazy. Dwa mecze kolidują, gdy ich okna
        `[kickoffAt, kickoffAt + Tournament.matchDuration)` się nakładają;
        stykające się okna (koniec o 12:00, start o 12:00) nie kolidują.
        Kolizja nigdy nie blokuje zapisu, nie ma jej w bazie: liczy się ją przy
        odczycie.
      properties:
        type: { $ref: '#/components/schemas/MatchCollisionType' }
        matchId:
          type: integer
          format: int64
          description: |
            Mecz po drugiej stronie kolizji. Kolizja jest symetryczna: jeśli
            ten mecz ma tu tamten, to tamten ma tu ten.

    AdminMatch:
      description: |
        Mecz widziany przez panel: kształt `Match` plus kolizje policzone przy
        odczycie. Kolizja to narzędzie organizatora, więc strona publiczna
        oddaje `Match` albo `PublicMatch`, bez tego pola.
      allOf:
        - $ref: '#/components/schemas/Match'
        - type: object
          required: [collisions]
          properties:
            collisions:
              type: array
              description: |
                Kolizje tego meczu z innymi meczami turnieju. Mecz bez
                `kickoffAt` nie ma kolizji, a mecz bez obiektu nie ma kolizji
                `venue`. Liczą się też mecze `finished`.
              items: { $ref: '#/components/schemas/MatchCollision' }

    PublicMatch:
      description: |
        Mecz widziany przez stronę publiczną: kształt `Match` plus strzelcy
        policzeni przy odczycie (#208). Oddają go `/public/t/{slug}/fixtures`
        i `/results`. Strona publiczna nie zna `SportConfig` (`GET /sports`
        wymaga logowania), więc nie wie sama, które zdarzenia liczą się do
        wyniku ani że samobój daje zdobycz przeciwnikowi: podsumowanie składa
        serwer. `/public/t/{slug}/matches` (drabinka) zostaje przy `Match`.
      allOf:
        - $ref: '#/components/schemas/Match'
        - type: object
          required: [scorers]
          properties:
            scorers:
              type: array
              description: |
                Zawodnicy, którzy w tym meczu zdobyli coś do wyniku, po jednym
                wierszu na zawodnika (samobój osobno, patrz `ownGoal`).

                - Wchodzą zdarzenia typów, których `stat` to pierwszy wpis
                  `availableStats` sportu (piłka `goals`, kosz `points`), oraz
                  samobój. Kartki, faule i inne statystyki nie wchodzą.
                - Zdarzenie bez zawodnika nie wchodzi.
                - Liczą się mecze `live` i `finished`, więc strzelcy meczu na
                  żywo dochodzą w trakcie — inaczej niż w klasyfikacji
                  (`StatLeaderboard`), która bierze tylko mecze zakończone.
                  Mecz `scheduled` ma `scorers: []`.
                - Kolejność: pierwsza minuta rosnąco, wiersze bez minut na
                  końcu, a przy równości `player.id` rosnąco.
              items: { $ref: '#/components/schemas/PublicMatchScorer' }

    PublicMatchScorer:
      type: object
      description: Jeden zawodnik w jednym meczu (`PublicMatch.scorers`).
      required: [team, player, value, minutes, ownGoal]
      properties:
        team:
          allOf:
            - $ref: '#/components/schemas/TeamSummary'
          description: |
            Drużyna strzelca, także przy samobóju — tak jak `MatchEvent.team`
            (#188). Stronę, po której wiersz stoi na ekranie, wyznacza
            `ownGoal`: samobój stoi po stronie przeciwnika tej drużyny.
        player: { $ref: '#/components/schemas/PlayerSummary' }
        value:
          type: integer
          minimum: 1
          description: |
            Suma `SportEventType.value` zdarzeń zawodnika w tym meczu, np.
            5 za rzut za 2 i rzut za 3. Zdarzenie bez minuty też się wlicza.
        minutes:
          type: array
          description: |
            Minuty zdarzeń rosnąco. Zdarzenie bez minuty liczy się do
            `value`, ale tu go nie ma. Gdy `minutes` ma tyle wpisów, ile
            wynosi `value`, każde zdarzenie jest warte 1 i ma minutę — wtedy
            ekran pokazuje minuty, w przeciwnym razie samą sumę.
          items: { type: integer, minimum: 1, maximum: 150 }
        ownGoal:
          type: boolean
          description: |
            Samobój. Tworzy osobny wiersz, nawet gdy ten sam zawodnik strzelił
            w meczu też do bramki przeciwnika.

    PublicMatchDetail:
      description: |
        Strona meczu (`GET /public/t/{slug}/matches/{match}`, #210): kształt
        `PublicMatch` ze strzelcami, plus relacja — zdarzenia z częścią meczu
        i bieżącym wynikiem — i wyniki części. Wszystko, co wymaga
        konfiguracji sportu i ustawień turnieju, liczy serwer: strona
        publiczna ich nie zna.

        **Zgodność z wynikiem.** API nie pilnuje zgodności zdarzeń z wynikiem
        meczu (#188, reguła 11). Gdy suma zdobyczy ze zdarzeń (jak
        w `PublicMatchEvent.scoreAfter`) nie równa się `homeScore:awayScore`,
        **wszystkie** `events[].scoreAfter` oraz `periods[].homeScore`
        i `awayScore` są `null`: strona nie może pokazać bieżącego wyniku,
        który kończy się na innym niż wynik w nagłówku.
      allOf:
        - $ref: '#/components/schemas/PublicMatch'
        - type: object
          required: [events, periods]
          properties:
            events:
              type: array
              description: |
                Wszystkie zdarzenia meczu, w kolejności jak
                w `GET /matches/{match}/events`: `minute` rosnąco, zdarzenia
                bez minuty na końcu, a przy tej samej minucie (albo jej braku)
                `id` rosnąco. Mecz `scheduled` ma `events: []`.
              items: { $ref: '#/components/schemas/PublicMatchEvent' }
            periods:
              type: array
              description: |
                Części meczu według `Tournament.periods`, w których jest co
                najmniej jedno zdarzenie, rosnąco po `number`. Turniej bez
                podziału (`count: 1`) i mecz `scheduled` mają `periods: []`.
              items: { $ref: '#/components/schemas/PublicMatchPeriod' }

    PublicMatchEvent:
      description: Zdarzenie na stronie meczu — `MatchEvent` plus część meczu i wynik po zdarzeniu.
      allOf:
        - $ref: '#/components/schemas/MatchEvent'
        - type: object
          required: [period, scoreAfter]
          properties:
            period:
              type: [integer, 'null']
              minimum: 1
              description: |
                Numer części meczu według `Tournament.periods`:
                `min(count, ceil(minute / minutes))`. Doliczony czas zapisany
                zwykłą liczbą trafia do następnej części („45+2” → `47` →
                2. połowa), a dogrywka do ostatniej. `null` przy zdarzeniu
                bez minuty i przy każdym zdarzeniu turnieju bez podziału
                (`count: 1`).
            scoreAfter:
              oneOf:
                - $ref: '#/components/schemas/ScoreSnapshot'
                - { type: 'null' }
              description: |
                Wynik meczu po tym zdarzeniu. Niepusty tylko przy zdarzeniu,
                które zmienia wynik: typie, którego `stat` to pierwszy wpis
                `availableStats` sportu (piłka `goals`, kosz `points`), oraz
                samobóju, który podnosi wynik **przeciwnika** drużyny
                `team`. Zdobycz to `SportEventType.value`, a zdarzenia liczą
                się w kolejności listy, także te bez minuty. `null` przy
                kartce, faulu i przy niezgodności z wynikiem meczu (opis
                `PublicMatchDetail`).

    PublicMatchPeriod:
      type: object
      required: [number, label, homeScore, awayScore]
      description: Część meczu z co najmniej jednym zdarzeniem i jej wynik.
      properties:
        number: { type: integer, minimum: 1, maximum: 10 }
        label:
          type: string
          description: Etykieta z numerem według liczby części (`MatchPeriods`), np. „1. połowa”, „3. kwarta”.
        homeScore:
          type: [integer, 'null']
          minimum: 0
          description: Zdobycze gospodarza w tej części. `null` przy niezgodności z wynikiem meczu.
        awayScore:
          type: [integer, 'null']
          minimum: 0
          description: Zdobycze gościa w tej części. `null` przy niezgodności z wynikiem meczu.

    ScoreSnapshot:
      type: object
      required: [home, away]
      description: Wynik meczu w danej chwili.
      properties:
        home: { type: integer, minimum: 0 }
        away: { type: integer, minimum: 0 }

    StandingRow:
      type: object
      required: [position, team, played, won, drawn, lost, scoreFor, scoreAgainst, scoreDifference, points]
      properties:
        position:
          type: integer
          minimum: 1
          description: |
            Miejsce w tabeli, unikalne: wiersze jednej tabeli mają kolejno
            `1..n`, bez miejsc ex aequo. Ostatnim kryterium, po liście
            `Tournament.tiebreakers`, jest nazwa drużyny (alfabetycznie po
            polsku, bez rozróżniania wielkości liter), więc pełny remis też
            daje różne miejsca.
        team: { $ref: '#/components/schemas/TeamSummary' }
        played: { type: integer, minimum: 0 }
        won: { type: integer, minimum: 0 }
        drawn:
          type: integer
          minimum: 0
          description: 'Zawsze zero w sporcie z `allowsDraw: false`, bo remis nie może w nim wystąpić.'
        lost: { type: integer, minimum: 0 }
        scoreFor:
          type: integer
          minimum: 0
          description: 'Zdobycze drużyny: bramki w piłce, punkty w koszykówce. Nie mylić z `points`.'
        scoreAgainst: { type: integer, minimum: 0 }
        scoreDifference: { type: integer }
        points:
          type: integer
          description: Punkty za wyniki meczów, zgodnie z `Tournament.points`. Nigdy zdobycze.

    StandingTable:
      type: object
      required: [stageId, stageName, groupId, groupName, scoreLabel, allowsDraw, tiebreakers, rows]
      properties:
        stageId: { type: integer, format: int64 }
        stageName: { type: string }
        groupId: { type: [integer, 'null'], format: int64 }
        groupName: { type: [string, 'null'] }
        scoreLabel:
          type: string
          description: |
            Nagłówek kolumny `scoreFor`:`scoreAgainst`, wyprowadzony ze sportu
            turnieju: „Bramki" w piłce nożnej, „Punkty" w koszykówce. Pola w API
            nazywają się `score*` niezależnie od sportu — tak przewiduje
            [ADR-0003](../../docs/adr/0003-zdobycze-nazywaja-sie-score-nie-goals.md).
            To, że etykietę niesie odpowiedź, a nie mapowanie po stronie klienta,
            ustala [ADR-0006](../../docs/adr/0006-etykiete-zdobyczy-niesie-odpowiedz-tabeli.md);
            `StatLeaderboard.label` robi to samo dla klasyfikacji.
        allowsDraw:
          type: boolean
          description: |
            `SportConfig.allowsDraw` sportu turnieju. Mówi, czy tabela ma
            kolumnę remisów: w sporcie bez remisów `drawn` jest zawsze zerem
            i nic nie znaczy. Jedzie z tabelą z tego samego powodu co
            `scoreLabel` (ADR-0006) — strona publiczna nie zna `SportConfig`,
            bo `GET /sports` wymaga logowania.
        tiebreakers:
          type: array
          description: |
            Kryteria, według których ułożono **tę** tabelę, w kolejności
            stosowania, z etykietami z `SportConfig.tiebreakerLabels` sportu
            turnieju. Bez parametru podglądu to `Tournament.tiebreakers`,
            a z `?tiebreakers=` w `GET /tournaments/{tournament}/standings` —
            lista podglądu. Zdanie o kolejności pod tabelą zgadza się dzięki
            temu z wierszami, także w podglądzie. Ukrytego ostatniego
            kryterium (nazwa drużyny) na liście nie ma.
          items: { $ref: '#/components/schemas/StandingTiebreaker' }
        rows:
          type: array
          items: { $ref: '#/components/schemas/StandingRow' }

    StandingTiebreaker:
      type: object
      required: [code, label]
      properties:
        code: { $ref: '#/components/schemas/TiebreakerCode' }
        label:
          type: string
          minLength: 1
          description: Etykieta kryterium z `SportConfig.tiebreakerLabels` sportu turnieju.

    StatLeaderboardRow:
      type: object
      required: [position, player, team, value]
      properties:
        position:
          type: integer
          minimum: 1
          description: |
            Przy równej liczbie zdarzeń pozycja jest **dzielona**: trzech
            zawodników z jedną bramką dostaje `position: 3` każdy, a kolejny
            wynik zaczyna się od 6. Wiersze ex aequo idą po `player.id`
            rosnąco — porządek ma być stabilny między odświeżeniami, a nie
            wartościujący, bo tabela nie zna kryterium rozstrzygającego.
        player: { $ref: '#/components/schemas/PlayerSummary' }
        team: { $ref: '#/components/schemas/TeamSummary' }
        value: { type: integer, minimum: 0 }

    StatLeaderboard:
      type: object
      required: [stat, label, rows]
      properties:
        stat:
          type: string
          description: Kod statystyki, zgodny z `availableStats` sportu.
        label:
          type: string
          description: Etykieta statystyki z `SportConfig.statLabels` sportu turnieju, np. „Bramki” albo „Punkty”.
        rows:
          type: array
          items: { $ref: '#/components/schemas/StatLeaderboardRow' }

    PublicStat:
      type: object
      required: [code, label]
      properties:
        code:
          type: string
          description: Kod statystyki z `availableStats` sportu turnieju, do parametru `stat` w `/public/t/{slug}/leaderboard`.
        label:
          type: string
          minLength: 1
          description: Etykieta statystyki z `SportConfig.statLabels` sportu turnieju.

    PublicTournament:
      type: object
      required: [name, slug, status, sport, branding, stages, stats]
      properties:
        name: { type: string }
        slug: { type: string }
        status:
          type: string
          description: |
            Podzbiór `TournamentStatus` bez `draft`: szkic nie trafia do
            odpowiedzi publicznej (patrz parametr `Slug`).
          enum: [active, finished]
        sport: { $ref: '#/components/schemas/SportSummary' }
        branding: { $ref: '#/components/schemas/Branding' }
        stages:
          type: array
          items: { $ref: '#/components/schemas/Stage' }
        stats:
          type: array
          description: |
            Statystyki, według których liczy się klasyfikacja, w kolejności
            `SportConfig.availableStats`; pierwszy wpis to klasyfikacja
            domyślna. W bazie tego pola nie ma: serwer składa je
            z `availableStats` i `statLabels` sportu. Jedzie z turniejem, bo
            strona publiczna nie widzi `GET /sports` (wymaga logowania),
            a nawigacja potrzebuje nazw statystyk, zanim pobierze klasyfikację.
          items: { $ref: '#/components/schemas/PublicStat' }
